; Payment slips and product photos are sent as base64 text (up to ~3 MB)
post_max_size = 16M
upload_max_filesize = 16M
memory_limit = 256M

expose_php = Off
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
