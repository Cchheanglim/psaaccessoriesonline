ServerName localhost

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Keep the number of PHP workers small: Render's free plan has 512 MB RAM and
# each worker may hold a Supabase connection.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        10
    MaxConnectionsPerChild   1000
</IfModule>
