<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Your Order | PsaOnline</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Track your PsaOnline order, message the shop and review your items." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { sorbet: '#FFA552', 'sorbet-ink': '#A3520F', cotton: '#F9F3EA', espresso: '#2B1D1D' } } }
    };
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    @media print {
      header, footer, .no-print { display: none !important; }
      body { background: #fff !important; }
      main { padding: 0 !important; }
    }
    .star-input input:focus-visible + label { outline: 3px solid #2B1D1D; outline-offset: 2px; border-radius: 6px; }
  </style>
</head>
<body class="bg-[#FDFBF7] text-[#2B1D1D] font-sans min-h-screen flex flex-col antialiased">

  <header class="sticky top-0 z-40 bg-[#FDFBF7]/95 dark:bg-[#121215]/95 backdrop-blur-md border-b border-[#EFE4D6] dark:border-[#2A2A34]">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <a href="home.html" class="flex items-center gap-2" aria-label="PsaOnline home">
        <img src="assets/images/psa-accessories-online-logo.svg" alt="" class="h-9 w-auto" />
        <span class="text-lg font-black text-[#2B1D1D]">Psa<span class="text-sorbet-ink dark:text-sorbet">Online</span></span>
      </a>
      <a href="dashboard-buyer.html" class="h-11 px-4 inline-flex items-center gap-1.5 rounded-full border border-[#EFE4D6] dark:border-[#32323D] bg-white dark:bg-[#1E1E26] text-sm font-bold text-[#2B1D1D] hover:bg-[#F9F3EA]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        My orders
      </a>
    </div>
  </header>

  <main id="orderPage" class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10 space-y-5" aria-live="polite">
    <p class="text-sm text-stone-600">Loading your order…</p>
  </main>

  <footer class="no-print bg-[#F9F3EA] dark:bg-[#15151C] border-t border-[#EFE4D6] dark:border-[#272732] py-6 text-sm text-stone-600">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div>&copy; 2026 PsaOnline</div>
      <div class="flex items-center gap-5">
        <a href="about.html" class="py-2 hover:text-sorbet-ink">About us</a>
        <a href="privacy.html" class="py-2 hover:text-sorbet-ink">Privacy</a>
        <a href="terms.html" class="py-2 hover:text-sorbet-ink">Terms</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/store.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order') || '';
    // This is the customer's view. Staff and admins handle orders (and reply to messages) on the staff order page.
    if (psaIsStaffAccount()) location.replace(`order-detail--admin-payment-submitted.html${orderId ? '?order=' + encodeURIComponent(orderId) : ''}`);
    const page = document.getElementById('orderPage');
    const card = 'rounded-3xl bg-white dark:bg-[#1A1A22] border border-[#EFE4D6] dark:border-[#2D2D38] p-5 sm:p-6';
    let order = null;
    let messagesTimer = null;

    function findOrder() {
      if (PSA.online) return PSA.orders.find(o => o.id === orderId) || null;
      try { return JSON.parse(localStorage.getItem('psa_orders') || '[]').find(o => o.id === orderId) || null; } catch (e) { return null; }
    }

    // The current step: 1 payment/confirmation, 2 preparing, 3 out for delivery, 4 delivered (step 0, placed, is always done).
    function progress(o) {
      const status = String(o.status || '').toLowerCase();
      const orderStatus = o.orderStatus || (status === 'delivered' ? 'delivered' : status === 'cancelled' ? 'cancelled'
        : /out for delivery|dispatched|shipped/.test(status) ? 'out_for_delivery' : status === 'processing' ? 'processing' : 'pending_payment');
      const pay = o.paymentStatus || (/slip/.test(status) ? 'slip_uploaded' : /verified|paid/.test(status) ? 'verified' : /failed/.test(status) ? 'failed' : 'pending');
      const cod = o.paymentCode === 'cod';
      const paid = pay === 'verified' || pay === 'paid_demo';
      const step = { pending_payment: paid ? 2 : 1, processing: 2, out_for_delivery: 3, delivered: 4 }[orderStatus] ?? 1;
      return { step, orderStatus, pay, cod, awaiting: orderStatus === 'pending_payment' && !paid, cancelled: orderStatus === 'cancelled' };
    }

    function paymentNote(p) {
      if (p.cod) return p.awaiting ? 'Waiting for the shop to confirm' : 'Pay cash when it arrives';
      if (p.pay === 'slip_uploaded' && p.awaiting) return 'Slip sent, we are checking it';
      if (p.pay === 'failed') return 'Slip could not be verified';
      if (p.awaiting) return 'Waiting for your payment';
      return 'Paid';
    }

    function money(usd) { return `$${Number(usd || 0).toFixed(2)}`; }

    function renderNotFound() {
      page.innerHTML = `
        <section class="${card} text-center space-y-4">
          <h1 class="text-2xl font-black">We couldn't find that order</h1>
          <p class="text-base text-stone-600">${PSA.online && !PSA.user ? 'Sign in with the account you ordered with to see it.' : 'Check the link, or open it from your orders list.'}</p>
          <div class="flex flex-wrap justify-center gap-3">
            ${PSA.online && !PSA.user ? `<a href="login.html?next=${encodeURIComponent('order-detail.html?order=' + orderId)}" class="h-12 px-6 inline-flex items-center rounded-2xl bg-espresso text-cotton font-black">Sign in</a>` : ''}
            <a href="dashboard-buyer.html" class="h-12 px-6 inline-flex items-center rounded-2xl border-2 border-espresso dark:border-sorbet font-black text-[#2B1D1D]">My orders</a>
          </div>
        </section>`;
    }

    function renderTracker(p) {
      if (p.cancelled) {
        return `<div class="rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 p-4 text-base font-bold text-rose-800 dark:text-rose-200">This order was cancelled. If you already paid, message us below and we'll sort out a refund.</div>`;
      }
      const steps = [
        { label: 'Order placed', note: order.date || '' },
        { label: p.cod ? 'Confirmed' : 'Payment', note: paymentNote(p) },
        { label: 'Preparing', note: p.step >= 2 ? 'Packing your items' : '' },
        { label: 'Out for delivery', note: p.step >= 3 ? 'On the way to you' : '' },
        { label: 'Delivered', note: p.step >= 4 ? 'Enjoy!' : '' }
      ];
      return `
        <ol class="grid grid-cols-5 gap-1 sm:gap-2" aria-label="Order progress">
          ${steps.map((s, i) => {
            const done = i < p.step || (i === p.step && i === 4);
            const current = i === p.step && i !== 4;
            const warn = i === 1 && p.pay === 'failed';
            const dot = warn ? 'bg-rose-600 text-white' : done ? 'bg-espresso text-cotton dark:bg-sorbet dark:text-espresso' : current ? 'bg-sorbet text-espresso ring-4 ring-sorbet/30' : 'bg-[#EFE4D6] dark:bg-[#2D2D38] text-stone-500';
            return `
            <li class="flex flex-col items-center text-center gap-2" ${current ? 'aria-current="step"' : ''}>
              <span class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center font-black text-sm ${dot}">${done ? '✓' : warn ? '!' : i + 1}</span>
              <span class="text-xs sm:text-sm font-black leading-tight ${done || current ? 'text-[#2B1D1D]' : 'text-stone-500'}">${s.label}</span>
              ${s.note ? `<span class="hidden sm:block text-xs text-stone-600 leading-snug">${psaEsc(s.note)}</span>` : ''}
            </li>`;
          }).join('')}
        </ol>
        <p class="sm:hidden mt-3 text-sm font-bold text-[#2B1D1D]">${psaEsc(steps[Math.min(p.step, 4)].label)}: <span class="font-semibold text-stone-600">${psaEsc(steps[Math.min(p.step, 4)].note || paymentNote(p))}</span></p>`;
    }

    function nextAction(p) {
      const payHref = `order-detail--buyer-pending.html?order=${encodeURIComponent(order.id)}`;
      if (p.cancelled) return '';
      if (!p.cod && p.awaiting && p.pay === 'failed') {
        return `<a href="${payHref}" class="no-print h-12 px-6 inline-flex items-center justify-center rounded-2xl bg-sorbet text-espresso font-black">Upload a new slip</a>`;
      }
      if (!p.cod && p.awaiting && p.pay !== 'slip_uploaded') {
        return `<a href="${payHref}" class="no-print h-12 px-6 inline-flex items-center justify-center rounded-2xl bg-sorbet text-espresso font-black">Pay now &amp; upload slip</a>`;
      }
      if (p.step === 4 && !order.reviewed) {
        return `<a href="#review" class="no-print h-12 px-6 inline-flex items-center justify-center rounded-2xl bg-sorbet text-espresso font-black">Review your items</a>`;
      }
      return '';
    }

    function renderOrder() {
      const p = progress(order);
      const items = Array.isArray(order.items) ? order.items : [];
      const subtotal = Number(order.subtotalUSD ?? order.totalUSD);
      const delivery = Number(order.deliveryUSD || 0);
      const slip = typeof order.slipImage === 'string' && /^(data:image\/|https?:\/\/)/.test(order.slipImage) ? order.slipImage : null;

      page.innerHTML = `
        <section class="${card}">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl sm:text-3xl font-black tracking-tight">Order ${psaEsc(order.id)}</h1>
              <p class="mt-1 text-sm text-stone-600">Placed ${psaEsc(order.date || '')} &middot; ${psaEsc(order.paymentMethod || '')}</p>
            </div>
            <div class="text-right">
              <div class="text-2xl font-black">${money(order.totalUSD)}</div>
            </div>
          </div>
          <div class="mt-6">${renderTracker(p)}</div>
          <div class="mt-6 flex flex-wrap gap-3">
            ${nextAction(p)}
            <button type="button" onclick="window.print()" class="no-print h-12 px-5 inline-flex items-center rounded-2xl border border-[#EFE4D6] dark:border-[#32323D] font-bold text-[#2B1D1D] hover:bg-[#F9F3EA] cursor-pointer">Print receipt</button>
          </div>
        </section>

        <div class="grid gap-5 md:grid-cols-5">
          <section class="${card} md:col-span-3" aria-labelledby="itemsTitle">
            <h2 id="itemsTitle" class="text-lg font-black">Items</h2>
            <ul class="mt-3 divide-y divide-[#F3EAD9] dark:divide-[#2D2D38]">
              ${items.map(it => `
                <li class="py-3 flex items-center gap-3">
                  <img src="${psaEsc(it.image || '')}" alt="" class="w-16 h-16 rounded-2xl object-cover bg-cotton shrink-0" />
                  <div class="min-w-0 flex-1">
                    <a href="product-detail.html?id=${encodeURIComponent(it.id || '')}" class="block text-base font-bold text-[#2B1D1D] leading-snug hover:underline">${psaEsc(it.title)}</a>
                    <div class="text-sm text-stone-600">Qty ${Number(it.quantity) || 1} &middot; ${money(it.priceUSD)} each</div>
                  </div>
                  <div class="text-right text-base font-black tabular-nums">${money(Number(it.priceUSD) * Number(it.quantity))}</div>
                </li>`).join('')}
            </ul>
            <dl class="mt-3 pt-3 border-t border-[#EFE4D6] dark:border-[#2D2D38] space-y-1.5 text-base">
              <div class="flex justify-between"><dt class="text-stone-600">Subtotal</dt><dd class="font-bold tabular-nums">${money(subtotal)}</dd></div>
              ${Number(order.memberDiscountUSD) ? `<div class="flex justify-between"><dt class="text-stone-600">Member discount</dt><dd class="font-bold tabular-nums text-emerald-700">-${money(order.memberDiscountUSD)}</dd></div>` : ''}
              ${Number(order.discountUSD) ? `<div class="flex justify-between"><dt class="text-stone-600">Promo${order.promoCode ? ' ' + psaEsc(order.promoCode) : ''}</dt><dd class="font-bold tabular-nums text-emerald-700">-${money(order.discountUSD)}</dd></div>` : ''}
              <div class="flex justify-between"><dt class="text-stone-600">Delivery</dt><dd class="font-bold tabular-nums">${delivery ? money(delivery) : 'Free'}</dd></div>
              <div class="flex justify-between text-lg"><dt class="font-black">Total</dt><dd class="font-black tabular-nums">${money(order.totalUSD)}</dd></div>
              <div class="flex justify-between text-sm"><dt class="text-stone-600">In riel ($1 = 4,000៛)</dt><dd class="font-bold tabular-nums text-stone-600">${psaRiel(order.totalUSD)}</dd></div>
            </dl>
          </section>

          <section class="${card} md:col-span-2 space-y-4" aria-labelledby="deliveryTitle">
            <div>
              <h2 id="deliveryTitle" class="text-lg font-black">Delivery</h2>
              <p class="mt-2 text-base font-bold">${psaEsc(order.customerName || '')}</p>
              <p class="text-base text-stone-600">${psaEsc(order.phone || '')}</p>
              <p class="mt-1 text-base text-stone-600 whitespace-pre-line">${psaEsc(order.address || '')}</p>
              ${order.notes ? `<p class="mt-2 text-sm text-stone-600"><span class="font-bold text-[#2B1D1D]">Note:</span> ${psaEsc(order.notes)}</p>` : ''}
            </div>
            <div>
              <h2 class="text-lg font-black">Payment</h2>
              <p class="mt-1 text-base text-stone-600">${psaEsc(order.paymentMethod || '')} &middot; ${psaEsc(paymentNote(p))}</p>
              ${slip ? `<a href="${psaEsc(slip)}" target="_blank" rel="noopener" class="mt-3 block w-32"><img src="${psaEsc(slip)}" alt="Your payment slip" class="w-32 h-32 object-cover rounded-2xl border border-[#EFE4D6]" /><span class="mt-1 block text-sm font-bold text-sorbet-ink dark:text-sorbet underline underline-offset-2">View your slip</span></a>` : ''}
            </div>
          </section>
        </div>

        <section id="messages" class="${card} no-print" aria-labelledby="messagesTitle"></section>
        <section id="review" class="${card} no-print scroll-mt-24 ${p.step === 4 ? '' : 'hidden'}" aria-labelledby="reviewTitle"></section>`;

      renderMessagesShell();
      if (p.step === 4) renderReview();
      if (location.hash === '#review' && p.step === 4) document.getElementById('review').scrollIntoView();
    }

    /* ---------- Messages ---------- */
    // First name of the staff member who approved the order: the customer's contact for it.
    function contactName() {
      return order && order.handledBy ? String(order.handledBy).trim().split(/\s+/)[0] : '';
    }

    function renderMessagesShell() {
      const box = document.getElementById('messages');
      if (!PSA.online || !PSA.user) {
        box.innerHTML = `<h2 id="messagesTitle" class="text-lg font-black">Questions about this order?</h2>
          <p class="mt-2 text-base text-stone-600">${PSA.online ? 'Sign in to message the shop here, or ' : ''}message us on <a href="https://t.me/psaonline_support" target="_blank" rel="noopener noreferrer" class="font-bold text-sorbet-ink dark:text-sorbet underline">Telegram</a>.</p>`;
        return;
      }
      box.innerHTML = `
        <h2 id="messagesTitle" class="text-lg font-black">${contactName() ? `Chat with ${psaEsc(contactName())}` : 'Messages with the shop'}</h2>
        <p class="text-sm text-stone-600">${contactName() ? `${psaEsc(contactName())} from PsaOnline approved your order and replies here. Ask about delivery times, changes or anything else.` : 'Ask about delivery times, changes or anything else about this order. Whoever approves your order will reply here.'}</p>
        <div id="messageList" class="mt-4 space-y-3 max-h-[28rem] overflow-y-auto" aria-live="polite"><p class="text-sm text-stone-600">Loading messages…</p></div>
        <form id="messageForm" class="mt-4 flex flex-col sm:flex-row gap-2">
          <label for="messageInput" class="sr-only">Your message</label>
          <textarea id="messageInput" rows="2" maxlength="2000" required placeholder="Write a message…" class="flex-1 min-h-[3rem] rounded-2xl border border-[#EFE4D6] dark:border-[#32323D] bg-white dark:bg-[#1E1E26] px-4 py-3 text-base text-[#2B1D1D] focus:outline-none focus:border-sorbet focus:ring-2 focus:ring-sorbet/30"></textarea>
          <button type="submit" id="messageSendBtn" class="h-12 sm:self-end px-6 rounded-2xl bg-espresso text-cotton dark:bg-sorbet dark:text-espresso font-black cursor-pointer">Send</button>
        </form>
        <p id="messageError" class="hidden mt-2 text-sm font-bold text-rose-700" role="alert"></p>`;
      document.getElementById('messageForm').addEventListener('submit', sendMessage);
      loadMessages();
      clearInterval(messagesTimer);
      messagesTimer = setInterval(() => { if (!document.hidden) loadMessages(true); }, 20000);
      if (!renderMessagesShell.live) {
        // A new notification (e.g. the shop replied) refreshes the chat straight away.
        document.addEventListener('psa:notifications', () => loadMessages(true));
        renderMessagesShell.live = true;
      }
    }

    function renderMessages(list) {
      const box = document.getElementById('messageList');
      if (!box) return;
      if (!list.length) {
        box.innerHTML = '<p class="text-sm text-stone-600">No messages yet. We usually reply here, so check back after you send one.</p>';
        return;
      }
      box.innerHTML = list.map(m => {
        const mine = !m.fromStaff;
        const when = m.createdAt ? new Date(m.createdAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
        return `
          <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[85%] rounded-2xl px-4 py-2.5 ${mine ? 'bg-espresso text-cotton rounded-br-md' : 'bg-cotton dark:bg-[#252530] text-[#2B1D1D] rounded-bl-md'}">
              <div class="text-xs font-bold ${mine ? 'text-cotton/80' : 'text-stone-600'}">${mine ? 'You' : psaEsc(m.staffName ? m.staffName.split(' ')[0] + ' · PsaOnline' : 'PsaOnline')} &middot; ${psaEsc(when)}</div>
              <p class="mt-0.5 text-base whitespace-pre-line break-words">${psaEsc(m.body)}</p>
            </div>
          </div>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function loadMessages(quiet) {
      try {
        const { messages } = await psaApi('GET', `/api/orders/${encodeURIComponent(order.id)}/messages`);
        renderMessages(messages);
      } catch (err) {
        if (!quiet) document.getElementById('messageList').innerHTML = `<p class="text-sm font-bold text-rose-700">${psaEsc(err.message)}</p>`;
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const errorEl = document.getElementById('messageError');
      const body = input.value.trim();
      errorEl.classList.add('hidden');
      if (!body) return;
      const btn = document.getElementById('messageSendBtn');
      psaSetButtonLoading(btn, true, 'Sending…');
      try {
        const { messages } = await psaApi('POST', `/api/orders/${encodeURIComponent(order.id)}/messages`, { body });
        input.value = '';
        renderMessages(messages);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      } finally {
        psaSetButtonLoading(btn, false);
      }
    }

    /* ---------- Reviews ---------- */
    function renderReview() {
      const box = document.getElementById('review');
      if (order.reviewed) {
        box.innerHTML = `<h2 id="reviewTitle" class="text-lg font-black">Thanks for your review!</h2>
          <p class="mt-1 text-base text-stone-600">It now shows on the product pages. You can update it below anytime.</p>
          <button type="button" id="editReviewBtn" class="mt-3 h-11 px-5 rounded-2xl border border-[#EFE4D6] dark:border-[#32323D] font-bold text-[#2B1D1D] cursor-pointer">Update my review</button>`;
        document.getElementById('editReviewBtn').addEventListener('click', () => { order.reviewed = false; renderReview(); });
        return;
      }
      if (!PSA.online || !PSA.user) {
        box.innerHTML = `<h2 id="reviewTitle" class="text-lg font-black">Review your items</h2><p class="mt-1 text-base text-stone-600">Sign in to leave a review.</p>`;
        return;
      }
      const items = (order.items || []).filter((it, i, all) => it.id && all.findIndex(x => x.id === it.id) === i);
      box.innerHTML = `
        <h2 id="reviewTitle" class="text-lg font-black">How did you like them?</h2>
        <p class="text-sm text-stone-600">Your first name and last initial show with your review.</p>
        <form id="reviewForm" class="mt-4 space-y-5" novalidate>
          ${items.map((it, n) => `
            <fieldset class="rounded-2xl border border-[#EFE4D6] dark:border-[#2D2D38] p-4" data-review-id="${psaEsc(it.id)}">
              <legend class="px-1 text-base font-black text-[#2B1D1D]">${psaEsc(it.title)}</legend>
              <div class="flex items-center gap-3">
                <img src="${psaEsc(it.image || '')}" alt="" class="w-14 h-14 rounded-xl object-cover bg-cotton" />
                <div class="star-input flex flex-row-reverse justify-end gap-1" role="radiogroup" aria-label="Rating for ${psaEsc(it.title)}">
                  ${[5, 4, 3, 2, 1].map(v => `
                    <input type="radio" id="r${n}-${v}" name="rating-${n}" value="${v}" class="peer sr-only" />
                    <label for="r${n}-${v}" class="cursor-pointer w-11 h-11 flex items-center justify-center text-3xl text-stone-300 hover:text-sorbet peer-hover:text-sorbet peer-checked:text-sorbet" title="${v} star${v > 1 ? 's' : ''}"><span aria-hidden="true">★</span><span class="sr-only">${v} star${v > 1 ? 's' : ''}</span></label>`).join('')}
                </div>
              </div>
              <label for="c${n}" class="sr-only">Comment about ${psaEsc(it.title)}</label>
              <textarea id="c${n}" rows="2" maxlength="1000" placeholder="What did you think? (optional)" class="mt-3 w-full rounded-2xl border border-[#EFE4D6] dark:border-[#32323D] bg-white dark:bg-[#1E1E26] px-4 py-3 text-base text-[#2B1D1D] focus:outline-none focus:border-sorbet focus:ring-2 focus:ring-sorbet/30"></textarea>
            </fieldset>`).join('')}
          <p id="reviewError" class="hidden text-sm font-bold text-rose-700" role="alert"></p>
          <button type="submit" id="reviewSubmitBtn" class="h-12 px-7 rounded-2xl bg-espresso text-cotton dark:bg-sorbet dark:text-espresso font-black cursor-pointer">Post review</button>
        </form>`;
      document.getElementById('reviewForm').addEventListener('submit', submitReview);
    }

    async function submitReview(e) {
      e.preventDefault();
      const errorEl = document.getElementById('reviewError');
      errorEl.classList.add('hidden');
      const reviews = [...document.querySelectorAll('[data-review-id]')].map((fs, n) => {
        const picked = fs.querySelector(`input[name="rating-${n}"]:checked`);
        return picked ? { id: fs.dataset.reviewId, rating: Number(picked.value), comment: document.getElementById(`c${n}`).value.trim() } : null;
      }).filter(Boolean);
      if (!reviews.length) {
        errorEl.textContent = 'Pick a star rating for at least one item.';
        errorEl.classList.remove('hidden');
        return;
      }
      const btn = document.getElementById('reviewSubmitBtn');
      psaSetButtonLoading(btn, true, 'Posting…');
      try {
        const res = await psaApi('POST', `/api/orders/${encodeURIComponent(order.id)}/reviews`, { reviews });
        order = { ...order, ...res.order };
        renderReview();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        psaSetButtonLoading(btn, false);
      }
    }

    order = findOrder();
    if (order) {
      document.title = `Order ${order.id} | PsaOnline`;
      renderOrder();
    } else {
      renderNotFound();
    }
  </script>
</body>
</html>
