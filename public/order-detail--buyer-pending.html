<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Pay for Your Order | PsaOnline</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Scan the shop's payment QR, then upload your transfer slip." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { sorbet: '#FFA552', 'sorbet-ink': '#A3520F', cotton: '#F9F3EA', espresso: '#2B1D1D' } } }
    };
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-[#FDFBF7] text-[#2B1D1D] font-sans min-h-screen flex flex-col antialiased">

  <header class="sticky top-0 z-40 bg-[#FDFBF7]/95 dark:bg-[#121215]/95 backdrop-blur-md border-b border-[#EFE4D6] dark:border-[#2A2A34]">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <a href="home.html" class="flex items-center gap-2" aria-label="PsaOnline home">
        <img src="assets/images/psa-accessories-online-logo.svg" alt="" class="h-9 w-auto" />
        <span class="text-lg font-black text-[#2B1D1D]" data-psa-brand>Psa<span class="text-sorbet-ink dark:text-sorbet">Online</span></span>
      </a>
      <a href="dashboard-buyer.html" class="h-11 px-4 inline-flex items-center gap-1.5 rounded-full border border-[#EFE4D6] dark:border-[#32323D] bg-white dark:bg-[#1E1E26] text-sm font-bold text-[#2B1D1D] hover:bg-[#F9F3EA]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        My orders
      </a>
    </div>
  </header>

  <main id="payPage" class="flex-1 w-full max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-10 space-y-5">
    <p class="text-sm text-stone-600">Loading your order…</p>
  </main>

  <footer data-psa-footer class="mt-auto"></footer>

  <script src="assets/js/store.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order') || '';
    // This is the customer's view. Staff and admins handle orders (and reply to messages) on the staff order page.
    if (psaIsStaffAccount()) location.replace(`order-detail--admin-payment-submitted.html${orderId ? '?order=' + encodeURIComponent(orderId) : ''}`);
    const page = document.getElementById('payPage');
    const card = 'rounded-3xl bg-white dark:bg-[#1A1A22] border border-[#EFE4D6] dark:border-[#2D2D38] p-5 sm:p-7';
    let slipDataUrl = null;

    function findOrder() {
      if (PSA.online) return PSA.orders.find(o => o.id === orderId) || null;
      try { return JSON.parse(localStorage.getItem('psa_orders') || '[]').find(o => o.id === orderId) || null; } catch (e) { return null; }
    }

    // The QR the admin set for this payment method: an uploaded picture, a link, or text to encode.
    function qrImage(method) {
      const data = method && method.qrData;
      if (!data) return null;
      if (/^(data:image\/|https?:\/\/)/.test(data)) return data;
      return `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(data)}`;
    }

    const order = findOrder();
    const method = order ? (PSA.paymentMethods || []).find(m => m.code === order.paymentCode) : null;

    function render() {
      if (!order) {
        page.innerHTML = `
          <section class="${card} text-center space-y-4">
            <h1 class="text-2xl font-black">We couldn't find that order</h1>
            <p class="text-base text-stone-600">${PSA.online && !PSA.user ? 'Sign in with the account you ordered with.' : 'Open it from your orders list.'}</p>
            <a href="${PSA.online && !PSA.user ? 'login.html?next=' + encodeURIComponent(psaPageName() + location.search) : 'dashboard-buyer.html'}" class="h-12 px-6 inline-flex items-center rounded-2xl bg-espresso text-cotton font-black">${PSA.online && !PSA.user ? 'Sign in' : 'My orders'}</a>
          </section>`;
        return;
      }

      if (order.paymentCode === 'cod' || order.slipUploaded && order.paymentStatus !== 'failed' || ['verified', 'paid_demo'].includes(order.paymentStatus)) {
        window.location.replace(`order-detail.html?order=${encodeURIComponent(order.id)}`);
        return;
      }

      const qr = qrImage(method);
      const failed = order.paymentStatus === 'failed';
      page.innerHTML = `
        <section class="${card} text-center">
          <p class="text-sm font-black text-sorbet-ink dark:text-sorbet">Order ${psaEsc(order.id)}</p>
          <h1 class="mt-1 text-3xl sm:text-4xl font-black tracking-tight">${failed ? 'Please send a new slip' : 'Pay, then send your slip'}</h1>
          ${failed ? '<p class="mt-3 text-base font-bold text-rose-700">We couldn\'t match your last slip to this order. Check the amount and upload the correct screenshot.</p>' : ''}
          <div class="mt-5 inline-flex flex-col items-center rounded-2xl bg-cotton dark:bg-[#252530] px-6 py-4">
            <span class="text-sm font-bold text-stone-600">Amount to pay</span>
            <span class="text-4xl font-black tabular-nums">$${Number(order.totalUSD).toFixed(2)}</span>
          </div>
        </section>

        <section class="${card}" aria-labelledby="stepScan">
          <h2 id="stepScan" class="text-xl font-black"><span class="text-sorbet-ink dark:text-sorbet">1.</span> Scan with your banking app</h2>
          <p class="mt-1 text-base text-stone-600">${psaEsc(method ? method.name : (order.paymentMethod || 'Bank transfer'))}${method && method.description ? ' &middot; ' + psaEsc(method.description) : ''}</p>
          ${qr ? `
            <div class="mt-5 mx-auto w-full max-w-[18rem] rounded-3xl bg-white p-4 border-2 border-espresso">
              <img src="${psaEsc(qr)}" alt="Payment QR code for ${psaEsc(method ? method.name : 'this order')}" class="w-full aspect-square object-contain" />
            </div>
            <p class="mt-3 text-center text-sm text-stone-600">Screenshot this QR and open it from your banking app's scan screen if you're on the same phone.</p>`
          : `<div class="mt-4 rounded-2xl border-2 border-dashed border-[#EFE4D6] dark:border-[#2D2D38] p-5 text-base text-stone-600">The shop hasn't added a QR code for this method yet. Transfer to the account below, or <a href="https://t.me/psaonline_support" target="_blank" rel="noopener noreferrer" class="font-bold text-sorbet-ink dark:text-sorbet underline">ask us on Telegram</a>.</div>`}
          ${method && (method.accountName || method.accountNumber) ? `
            <dl class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3 text-base">
              ${method.accountName ? `<div class="rounded-2xl bg-cotton dark:bg-[#252530] px-4 py-3"><dt class="text-sm text-stone-600">Account name</dt><dd class="font-black break-words">${psaEsc(method.accountName)}</dd></div>` : ''}
              ${method.accountNumber ? `<div class="rounded-2xl bg-cotton dark:bg-[#252530] px-4 py-3"><dt class="text-sm text-stone-600">Account number</dt><dd class="font-black break-words font-mono">${psaEsc(method.accountNumber)}</dd></div>` : ''}
            </dl>` : ''}
        </section>

        <section class="${card}" aria-labelledby="stepSlip">
          <h2 id="stepSlip" class="text-xl font-black"><span class="text-sorbet-ink dark:text-sorbet">2.</span> Upload your transfer slip</h2>
          <p class="mt-1 text-base text-stone-600">A screenshot of the successful transfer from your banking app. We check it and start packing.</p>
          <label for="slipInput" id="slipDrop" class="mt-4 flex flex-col items-center justify-center gap-2 rounded-3xl border-2 border-dashed border-[#E3D3BC] dark:border-[#3A3A46] bg-[#FDFBF7] dark:bg-[#17171C] p-6 text-center cursor-pointer hover:border-sorbet">
            <span id="slipPreviewWrap" class="hidden"><img id="slipPreview" alt="Your slip" class="max-h-72 rounded-2xl" /></span>
            <span id="slipPrompt" class="text-base font-black text-[#2B1D1D]">Tap to choose your slip screenshot</span>
            <span class="text-sm text-stone-600">JPG or PNG</span>
          </label>
          <input type="file" id="slipInput" accept="image/*" class="sr-only" />
          <p id="slipError" class="hidden mt-3 text-sm font-bold text-rose-700" role="alert"></p>
          <button type="button" id="slipSubmitBtn" class="mt-5 w-full h-14 rounded-2xl bg-espresso text-cotton dark:bg-sorbet dark:text-espresso font-black text-base cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">Send slip</button>
          <p class="mt-3 text-center text-sm text-stone-600">Paying cash instead, or stuck? <a href="order-detail.html?order=${encodeURIComponent(order.id)}#messages" class="font-bold text-sorbet-ink dark:text-sorbet underline">Message us about this order</a>.</p>
        </section>`;

      document.getElementById('slipInput').addEventListener('change', pickSlip);
      document.getElementById('slipSubmitBtn').addEventListener('click', submitSlip);
    }

    async function pickSlip(e) {
      const file = e.target.files && e.target.files[0];
      const errorEl = document.getElementById('slipError');
      errorEl.classList.add('hidden');
      if (!file) return;
      try {
        slipDataUrl = await psaImageToDataUrl(file, 1400, 0.85);
        document.getElementById('slipPreview').src = slipDataUrl;
        document.getElementById('slipPreviewWrap').classList.remove('hidden');
        document.getElementById('slipPrompt').textContent = 'Tap to choose a different screenshot';
      } catch (err) {
        slipDataUrl = null;
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    }

    async function submitSlip() {
      const errorEl = document.getElementById('slipError');
      errorEl.classList.add('hidden');
      if (!slipDataUrl) {
        errorEl.textContent = 'Choose your slip screenshot first.';
        errorEl.classList.remove('hidden');
        return;
      }
      const btn = document.getElementById('slipSubmitBtn');
      if (PSA.online) {
        psaSetButtonLoading(btn, true, 'Sending…');
        try {
          await psaApi('POST', `/api/orders/${encodeURIComponent(order.id)}/slip`, { slip: slipDataUrl });
        } catch (err) {
          psaSetButtonLoading(btn, false);
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
          return;
        }
      } else {
        // Preview without the server: remember it in this browser only
        try {
          const orders = JSON.parse(localStorage.getItem('psa_orders') || '[]');
          const o = orders.find(x => x.id === order.id);
          if (o) { o.status = 'Slip Uploaded'; o.slipUploaded = true; o.paymentStatus = 'slip_uploaded'; localStorage.setItem('psa_orders', JSON.stringify(orders)); }
        } catch (e) {}
      }
      window.location.replace(`order-detail.html?order=${encodeURIComponent(order.id)}`);
    }

    render();
  </script>
</body>
</html>
