<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Create Buyer Account — PsaOnline</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Sign up for PsaOnline to get instant notifications on new Gen-Z streetwear jewelry and bag drops." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-[#FDFBF7] text-[#2B1D1D] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#FFA552] selection:text-white">

  <!-- Header -->
  <header class="bg-[#FDFBF7] border-b border-[#EFE4D6]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2.5 group">
        <img src="assets/images/psa-accessories-online-logo.svg" alt="" class="h-10 w-auto object-contain group-hover:scale-105 transition-transform duration-300" />
        <span class="text-lg sm:text-xl font-black text-[#2B1D1D]" data-psa-brand>
          Psa<span class="text-[#FFA552]">Online</span>
        </span>
      </a>

      <div class="flex items-center gap-3">
        <a data-hide-mobile href="home.html" class="px-3.5 py-1.5 rounded-xl border border-[#EFE4D6] bg-white hover:border-[#FFA552] text-xs font-bold text-[#2B1D1D] flex items-center gap-1.5 transition shadow-xs">
          <svg class="w-3.5 h-3.5 text-[#FFA552]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Back to Storefront</span>
        </a>
        <a href="login.html" class="text-xs font-bold text-[#FFA552] hover:underline flex items-center gap-1 transition">
          <span>Sign In &rarr;</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Centered Register Card -->
  <main class="flex-1 flex items-center justify-center p-4 py-8 sm:py-12">
    <div class="reveal-init w-full max-w-md bg-white rounded-3xl border border-[#EFE4D6] p-6 sm:p-8 shadow-xl space-y-6">
      
      <!-- Brand Header -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#2B1D1D] to-[#FFA552] text-white font-black text-xl flex items-center justify-center mx-auto shadow-md">
          P
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-[#2B1D1D] tracking-tight">Join PsaOnline</h1>
        <p class="text-xs text-stone-500">Access exclusive viral drops, express delivery & order tracking.</p>
      </div>

      <!-- Registration Form -->
      <form class="space-y-4" onsubmit="handleRegister(event)">
        
        <div class="space-y-1">
          <label for="reg_name" class="text-xs font-bold text-[#2B1D1D]">Full Name</label>
          <input
            type="text"
            id="reg_name"
            required
            placeholder="e.g. Sophea Chhum"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-[#FDFBF7] border border-[#EFE4D6] text-[#2B1D1D] placeholder-stone-400 focus:outline-none focus:border-[#FFA552] focus:ring-1 focus:ring-[#FFA552] transition"
          />
        </div>

        <div class="space-y-1">
          <label for="reg_email" class="text-xs font-bold text-[#2B1D1D]">Email Address</label>
          <input
            type="email"
            id="reg_email"
            required
            autocomplete="email"
            placeholder="e.g. sophea@gmail.com"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-[#FDFBF7] border border-[#EFE4D6] text-[#2B1D1D] placeholder-stone-400 focus:outline-none focus:border-[#FFA552] focus:ring-1 focus:ring-[#FFA552] transition"
          />
        </div>

        <div class="space-y-1">
          <label for="reg_phone" class="text-xs font-bold text-[#2B1D1D]">Phone Number</label>
          <input
            type="tel"
            id="reg_phone"
            required
            placeholder="e.g. +855 96 554 1234"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-[#FDFBF7] border border-[#EFE4D6] text-[#2B1D1D] placeholder-stone-400 focus:outline-none focus:border-[#FFA552] focus:ring-1 focus:ring-[#FFA552] transition font-mono"
          />
        </div>

        <div class="space-y-1">
          <label for="reg_password" class="text-xs font-bold text-[#2B1D1D]">Password</label>
          <input
            type="password"
            id="reg_password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-[#FDFBF7] border border-[#EFE4D6] text-[#2B1D1D] placeholder-stone-400 focus:outline-none focus:border-[#FFA552] focus:ring-1 focus:ring-[#FFA552] transition font-mono"
          />
        </div>

        <!-- Required Terms & Privacy Checkbox -->
        <div class="flex items-start gap-2 pt-1">
          <input
            type="checkbox"
            id="reg_agree"
            required
            class="mt-0.5 rounded border-[#EFE4D6] text-[#FFA552] focus:ring-[#FFA552] cursor-pointer"
          />
          <label for="reg_agree" class="text-xs text-stone-600 select-none cursor-pointer leading-tight">
            I agree to the <a href="terms.html" target="_blank" class="font-bold text-[#FFA552] underline underline-offset-2">Terms of Service</a> and <a href="privacy.html" target="_blank" class="font-bold text-[#FFA552] underline underline-offset-2">Privacy Policy</a>
          </label>
        </div>

        <p id="registerError" class="hidden text-[11px] font-bold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2" role="alert"></p>

        <button
          type="submit"
          id="registerSubmitBtn"
          class="btn-press w-full py-3.5 rounded-xl bg-[#FFA552] hover:bg-[#E88C35] text-white font-black text-xs shadow-md transition-all cursor-pointer"
        >
          Create Account
        </button>

      </form>

      <div class="text-center pt-2 border-t border-[#EFE4D6] text-xs text-stone-500">
        Already registered? <a href="login.html" class="font-black text-[#FFA552] hover:underline">Sign In</a>
      </div>

    </div>
  </main>

  <footer data-psa-footer class="mt-auto"></footer>

  <script src="assets/js/store.js"></script>
  <script>
    // Real-time clearing of error on typing
    ['reg_name', 'reg_email', 'reg_phone', 'reg_password'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', () => psaClearFieldError(el));
      }
    });
    const agreeBox = document.getElementById('reg_agree');
    if (agreeBox) {
      agreeBox.addEventListener('change', () => psaClearFieldError('reg_agree'));
    }

    function validateRegisterForm() {
      psaClearAllFieldErrors(document.querySelector('form'));
      let hasError = false;

      const nameVal = document.getElementById('reg_name').value.trim();
      const emailVal = document.getElementById('reg_email').value.trim();
      const phoneVal = document.getElementById('reg_phone').value.trim();
      const passVal = document.getElementById('reg_password').value;
      const agreeVal = document.getElementById('reg_agree').checked;

      const nameErr = psaValidateMinLength(nameVal, 2, 'Full name');
      if (nameErr) {
        psaShowFieldError('reg_name', nameErr);
        hasError = true;
      }

      const emailErr = psaValidateEmail(emailVal);
      if (emailErr) {
        psaShowFieldError('reg_email', emailErr);
        hasError = true;
      }

      const phoneErr = psaValidatePhone(phoneVal, true);
      if (phoneErr) {
        psaShowFieldError('reg_phone', phoneErr);
        hasError = true;
      }

      const passErr = psaValidatePassword(passVal, 6);
      if (passErr) {
        psaShowFieldError('reg_password', passErr);
        hasError = true;
      }

      if (!agreeVal) {
        psaShowFieldError('reg_agree', 'You must agree to the Terms of Service and Privacy Policy to register.');
        hasError = true;
      }

      return !hasError;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const errorEl = document.getElementById('registerError');
      const btn = document.getElementById('registerSubmitBtn');
      errorEl.classList.add('hidden');

      if (!validateRegisterForm()) {
        return;
      }

      if (!PSA.online) {
        if (psaIsLocalPreview()) {
          psaSetButtonLoading(btn, true, 'Creating Account...');
          setTimeout(() => {
            window.location.href = 'dashboard-buyer.html';
          }, 300);
        } else {
          errorEl.textContent = PSA_OFFLINE_MESSAGE;
          errorEl.classList.remove('hidden');
        }
        return;
      }

      psaSetButtonLoading(btn, true, 'Creating Account...');
      try {
        await psaApi('POST', '/api/auth/register', {
          name: document.getElementById('reg_name').value.trim(),
          email: document.getElementById('reg_email').value.trim(),
          phone: document.getElementById('reg_phone').value.trim(),
          password: document.getElementById('reg_password').value
        });
        window.location.replace('dashboard-buyer.html');
      } catch (err) {
        psaSetButtonLoading(btn, false);
        if (err.errors) {
          psaApplyServerErrors(document.querySelector('form'), err.errors);
        } else {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
        }
      }
    }
  </script>
</body>
</html>
