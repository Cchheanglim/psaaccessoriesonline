<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>My account | PsaOnline</title>
  <meta name="description" content="Track your PsaOnline orders, saved items and recently viewed products." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sorbet: '#FFA552',
            cotton: '#F9F3EA',
            espresso: '#2B1D1D'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-[#FDFBF7] text-[#2B1D1D] font-sans min-h-screen flex flex-col antialiased selection:bg-[#FFA552] selection:text-white pb-mobile-nav">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#FDFBF7]/90 dark:bg-[#121215]/95 backdrop-blur-md border-b border-[#EFE4D6] dark:border-[#2D2D38]">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2.5 sm:gap-3 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#FFA552]" title="Psa Accessories Online">
        <img src="assets/images/psa-accessories-online-logo.svg" alt="Psa Accessories Online logo" class="h-9 sm:h-11 w-auto object-contain" />
        <span class="text-lg sm:text-xl font-black text-[#2B1D1D] dark:text-white">Psa<span class="text-[#FFA552]">Online</span></span>
      </a>

      <nav class="flex items-center gap-2" aria-label="Shop">
        <a href="home.html" class="px-3 h-9 inline-flex items-center gap-1.5 rounded-lg border border-[#EFE4D6] dark:border-[#32323D] bg-white dark:bg-[#1E1E26] text-xs font-bold text-[#2B1D1D] dark:text-white hover:bg-[#F9F3EA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]">
          <svg class="w-3.5 h-3.5 text-[#FFA552]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Back to Store</span>
        </a>
        <a href="products.html" class="hidden sm:inline-flex px-3 h-9 items-center rounded-lg text-xs font-bold text-[#2B1D1D] dark:text-white hover:bg-[#F9F3EA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]">Catalog</a>
        <a href="wishlist.html" class="relative w-9 h-9 inline-flex items-center justify-center rounded-lg text-[#2B1D1D] dark:text-white hover:bg-[#F9F3EA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]" aria-label="Wishlist">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          <span class="wishlist-count-badge hidden absolute -top-0.5 -right-0.5 min-w-[1.125rem] h-[1.125rem] px-1 rounded-full bg-rose-600 text-white text-[10px] font-bold items-center justify-center flex">0</span>
        </a>
        <a href="cart.html" class="relative w-9 h-9 inline-flex items-center justify-center rounded-lg text-[#2B1D1D] dark:text-white hover:bg-[#F9F3EA] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]" aria-label="Bag">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="cart-count-badge hidden absolute -top-0.5 -right-0.5 min-w-[1.125rem] h-[1.125rem] px-1 rounded-full bg-[#FFA552] text-stone-900 text-[10px] font-bold items-center justify-center flex">0</span>
        </a>
        <button type="button" onclick="localStorage.removeItem('psa_current_user'); window.location.href='login.html';" class="px-3 h-9 inline-flex items-center gap-1.5 rounded-lg border border-red-200 dark:border-red-900/50 bg-red-50 dark:bg-red-950/40 hover:bg-red-100 text-xs font-bold text-red-600 dark:text-red-400 cursor-pointer transition" title="Log Out">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span class="hidden sm:inline">Log Out</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-5 sm:py-8 flex-1 w-full space-y-4 sm:space-y-5">
    <h1 class="sr-only">My account</h1>

    <!-- Header card: avatar, name, level, stats -->
    <section class="rounded-2xl bg-[#2B1D1D] border border-[#2B1D1D] dark:border-[#3A2A2A] text-white overflow-hidden" aria-label="Profile">
      <div class="p-4 sm:p-6 flex items-center gap-3 sm:gap-4">
        <div class="shrink-0">
          <button type="button" id="avatarBtn" class="relative block w-14 h-14 sm:w-20 sm:h-20 rounded-full focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#FFA552] disabled:cursor-default" aria-label="Change profile photo">
            <span id="avatarBox" class="flex w-full h-full items-center justify-center rounded-full overflow-hidden bg-[#FFA552] text-stone-900 text-lg sm:text-2xl font-extrabold"></span>
            <span id="avatarCamera" class="absolute -bottom-1 -right-1 w-7 h-7 rounded-lg bg-stone-100 text-stone-900 border-2 border-[#2B1D1D] flex items-center justify-center" aria-hidden="true">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </span>
          </button>
          <input type="file" id="avatarInput" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true" />
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <div id="profileName" class="min-w-0 text-lg sm:text-2xl font-extrabold leading-tight text-white break-words"></div>
            <span id="levelBadge" class="hidden items-center rounded-md bg-[#FFA552] text-stone-900 text-xs font-bold px-2 py-0.5" title="Level is based on completed orders"></span>
          </div>
          <div id="profileEmail" class="text-sm text-[#E9DCCB] break-words"></div>
          <div id="profilePhone" class="text-sm text-[#E9DCCB] break-words"></div>
          <a id="signInLink" href="login.html" class="hidden mt-2 h-9 px-4 items-center rounded-lg bg-[#FFA552] hover:bg-[#E88C35] text-stone-900 text-sm font-bold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">Sign in</a>
        </div>

        <div class="self-start flex items-center shrink-0">
          <a href="chat.html" class="w-9 h-9 sm:w-10 sm:h-10 inline-flex items-center justify-center rounded-lg text-white hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]" aria-label="Customer service">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          </a>
          <a href="settings.html" class="w-9 h-9 sm:w-10 sm:h-10 inline-flex items-center justify-center rounded-lg text-white hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]" aria-label="Settings">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </a>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-4 divide-x divide-white/10 border-t border-white/10">
        <a href="wishlist.html" class="py-3 text-center hover:bg-white/5 focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-[#FFA552]">
          <div id="statWishlist" class="text-lg font-extrabold text-white tabular-nums">0</div>
          <div class="text-xs text-[#E9DCCB]">Wishlist</div>
        </a>
        <a href="viewed.html" class="py-3 text-center hover:bg-white/5 focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-[#FFA552]">
          <div id="statViewed" class="text-lg font-extrabold text-white tabular-nums">0</div>
          <div class="text-xs text-[#E9DCCB]">Viewed</div>
        </a>
        <button type="button" data-open-coupons class="py-3 text-center hover:bg-white/5 cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-[#FFA552]">
          <div id="statCoupons" class="text-lg font-extrabold text-white tabular-nums">0</div>
          <div class="text-xs text-[#E9DCCB]">Coupons</div>
        </button>
        <div class="py-3 text-center">
          <div id="statPoints" class="text-lg font-extrabold text-white tabular-nums">0</div>
          <div class="text-xs text-[#E9DCCB]">Points</div>
        </div>
      </div>
    </section>

    <!-- Order status shortcuts -->
    <section class="rounded-2xl bg-white dark:bg-[#1A1A22] border border-[#EFE4D6] dark:border-[#2D2D38]" aria-labelledby="myOrdersHeading">
      <div class="flex items-center justify-between px-4 sm:px-6 pt-4">
        <h2 id="myOrdersHeading" class="text-base font-extrabold text-[#2B1D1D]">My orders</h2>
        <button type="button" id="allOrdersBtn" class="inline-flex items-center gap-0.5 h-9 px-2 -mr-2 rounded-lg text-sm font-semibold text-stone-500 hover:text-[#2B1D1D] cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]">
          All orders
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div id="shortcutRow" class="grid grid-cols-5 px-1 sm:px-4 pb-2 pt-1"></div>
    </section>

    <!-- Tool grid -->
    <section class="rounded-2xl bg-white dark:bg-[#1A1A22] border border-[#EFE4D6] dark:border-[#2D2D38] p-1 sm:p-3" aria-label="Tools">
      <div id="toolGrid" class="grid grid-cols-3 sm:grid-cols-6"></div>
    </section>

    <!-- Order list -->
    <section id="orders" class="scroll-mt-24 space-y-3" aria-labelledby="orderListHeading">
      <div class="flex items-baseline justify-between gap-3 pt-2">
        <h2 id="orderListHeading" tabindex="-1" class="text-base font-extrabold text-[#2B1D1D] focus:outline-none"></h2>
        <button type="button" id="clearFilterBtn" class="hidden h-9 px-2 -mr-2 rounded-lg text-sm font-semibold text-[#E88C35] hover:underline cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]">Show all orders</button>
      </div>
      <div id="ordersContainer" class="space-y-3" aria-live="polite"></div>
    </section>

    <!-- Recommendations -->
    <section id="recsSection" class="space-y-3 pt-4" aria-labelledby="recsHeading">
      <div>
        <h2 id="recsHeading" class="text-base font-extrabold text-[#2B1D1D]">You may also like</h2>
        <p id="recsBasis" class="text-sm text-stone-500"></p>
      </div>
      <div id="recsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </section>
  </main>

  <!-- Mobile bottom navigation -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-lg border-t border-[#EFE4D6] px-4 py-2 flex items-center justify-around text-center select-none shadow-[0_-4px_20px_rgba(43,29,29,0.06)]" aria-label="Main">
    <a href="home.html" class="flex flex-col items-center gap-1 min-w-[3.5rem] text-stone-500 hover:text-[#2B1D1D] text-[10px]">
      <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Store</span>
    </a>
    <a href="products.html" class="flex flex-col items-center gap-1 min-w-[3.5rem] text-stone-500 hover:text-[#2B1D1D] text-[10px]">
      <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
      <span>Catalog</span>
    </a>
    <a href="wishlist.html" class="flex flex-col items-center gap-1 min-w-[3.5rem] text-stone-500 hover:text-rose-500 text-[10px]">
      <div class="relative">
        <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span class="wishlist-count-badge hidden absolute -top-1.5 -right-2 bg-rose-600 text-white text-[9px] font-black rounded-full w-4 h-4 flex items-center justify-center">0</span>
      </div>
      <span>Wishlist</span>
    </a>
    <a href="cart.html" class="flex flex-col items-center gap-1 min-w-[3.5rem] text-stone-500 hover:text-[#2B1D1D] text-[10px]">
      <div class="relative">
        <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span class="mobile-cart-badge hidden absolute -top-1.5 -right-2 bg-[#FFA552] text-stone-900 text-[9px] font-black rounded-full w-4 h-4 flex items-center justify-center">0</span>
      </div>
      <span>Bag</span>
    </a>
    <a href="dashboard-buyer.html" aria-current="page" class="flex flex-col items-center gap-1 min-w-[3.5rem] text-[#2B1D1D] font-bold text-[10px]">
      <svg class="w-5 h-5 text-[#FFA552]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Account</span>
    </a>
  </nav>

  <!-- Coupons dialog -->
  <dialog id="couponDialog" class="p-0 rounded-2xl w-[calc(100%-2rem)] max-w-md bg-white dark:bg-[#1A1A22] text-[#2B1D1D] border border-[#EFE4D6] dark:border-[#2D2D38] backdrop:bg-black/60" aria-labelledby="couponTitle">
    <div class="p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="couponTitle" class="text-base font-extrabold text-[#2B1D1D]">My coupons</h2>
        <button type="button" data-close-coupons class="w-9 h-9 -mr-2 inline-flex items-center justify-center rounded-lg text-stone-500 hover:bg-[#F9F3EA] cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]" aria-label="Close">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="couponList" class="space-y-2"></div>
    </div>
  </dialog>

  <!-- Status message -->
  <div id="notice" role="status" class="hidden fixed z-50 left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 max-w-[calc(100%-2rem)] rounded-lg bg-[#2B1D1D] text-white text-sm font-semibold px-4 py-2.5 shadow-lg border border-white/10"></div>

  <script src="assets/js/store.js"></script>
  <script>
    /* ---------- Helpers ---------- */
    const $ = (id) => document.getElementById(id);

    function readJSON(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return v == null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const ICONS = {
      wallet: '<path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>',
      box: '<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>',
      truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/>',
      star: '<path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>',
      refund: '<path d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>',
      heart: '<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>',
      clock: '<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>',
      pin: '<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>',
      ticket: '<path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>',
      chat: '<path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>',
      gear: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>',
      user: '<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>'
    };

    function icon(name, cls) {
      return '<svg class="' + (cls || 'w-5 h-5') + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[name] + '</svg>';
    }

    const FOCUS = 'focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#FFA552]';
    const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let noticeTimer = null;
    function notify(message) {
      const el = $('notice');
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => el.classList.add('hidden'), 3500);
    }

    /* ---------- Current user ---------- */
    function getUser() {
      const u = readJSON('psa_current_user', null);
      return u && typeof u === 'object' && typeof u.name === 'string' && u.name.trim() ? u : null;
    }

    function initialsOf(user) {
      if (typeof user.avatar === 'string' && user.avatar.trim()) return user.avatar.trim().slice(0, 2).toUpperCase();
      const parts = user.name.trim().split(/\s+/);
      return ((parts[0] || '')[0] || '') + ((parts.length > 1 ? parts[parts.length - 1][0] : '') || '');
    }

    /* ---------- Orders ---------- */
    const STATUS_GROUPS = {
      pending: ['payment pending', 'pending payment', 'awaiting payment', 'unpaid'],
      ship: ['slip uploaded', 'payment submitted', 'payment verified', 'paid', 'processing', 'preparing', 'to ship'],
      receive: ['on the way', 'shipped', 'out for delivery', 'dispatched', 'to receive'],
      delivered: ['delivered', 'completed'],
      refund: ['refund requested', 'refunding', 'refunded', 'return requested', 'returned']
    };

    function orderGroup(order) {
      const s = String((order && order.status) || '').trim().toLowerCase();
      for (const key in STATUS_GROUPS) {
        if (STATUS_GROUPS[key].indexOf(s) > -1) return key;
      }
      return 'other';
    }

    // The filter an order belongs to. Delivered orders count as "To review" until marked reviewed.
    function filterKeyOf(order) {
      const g = orderGroup(order);
      if (g === 'delivered') return order.reviewed ? 'other' : 'review';
      return g;
    }

    function getOrders() {
      const list = readJSON('psa_orders', []);
      return Array.isArray(list) ? list.filter((o) => o && typeof o === 'object') : [];
    }

    const SHORTCUTS = [
      { key: 'pending', label: 'Pending payment', icon: 'wallet' },
      { key: 'ship', label: 'To ship', icon: 'box' },
      { key: 'receive', label: 'To receive', icon: 'truck' },
      { key: 'review', label: 'To review', icon: 'star' },
      { key: 'refund', label: 'Refund / Returns', icon: 'refund' }
    ];

    const FILTER_LABELS = { all: 'All orders' };
    SHORTCUTS.forEach((s) => { FILTER_LABELS[s.key] = s.label; });

    // Member level from completed orders. Edit the thresholds here.
    const MEMBER_LEVELS = [
      { min: 8, label: 'Level 3' },
      { min: 3, label: 'Level 2' },
      { min: 0, label: 'Level 1' }
    ];

    const ORDER_CAP = 5;
    let activeFilter = 'all';
    let showAllOrders = false;

    /* ---------- Header card ---------- */
    // Lets a long email wrap after the "@" instead of in the middle of the domain.
    function setEmail(el, text, isEmail) {
      el.replaceChildren();
      const at = text.indexOf('@');
      if (isEmail && at > 0) {
        el.append(document.createTextNode(text.slice(0, at + 1)), document.createElement('wbr'), document.createTextNode(text.slice(at + 1)));
      } else {
        el.textContent = text;
      }
    }

    function renderProfile() {
      const user = getUser();
      const box = $('avatarBox');
      box.replaceChildren();

      if (user && typeof user.avatarUrl === 'string' && user.avatarUrl.indexOf('data:image/') === 0) {
        const img = new Image();
        img.alt = '';
        img.src = user.avatarUrl;
        img.className = 'w-full h-full object-cover';
        box.appendChild(img);
      } else if (user) {
        box.textContent = initialsOf(user);
      } else {
        box.innerHTML = icon('user', 'w-8 h-8');
      }

      $('avatarBtn').disabled = !user;
      $('avatarCamera').classList.toggle('hidden', !user);
      $('avatarBtn').setAttribute('aria-label', user ? 'Change profile photo' : 'Profile photo');

      $('profileName').textContent = user ? user.name : 'Guest';
      setEmail($('profileEmail'), user ? (user.email || '') : 'Sign in to manage your account.', !!user);
      $('profilePhone').textContent = user && user.phone ? user.phone : '';
      $('profilePhone').classList.toggle('hidden', !(user && user.phone));
      $('signInLink').classList.toggle('hidden', !!user);
      $('signInLink').classList.toggle('inline-flex', !user);

      const badge = $('levelBadge');
      if (user) {
        const delivered = getOrders().filter((o) => orderGroup(o) === 'delivered').length;
        const level = MEMBER_LEVELS.find((l) => delivered >= l.min);
        badge.textContent = level.label;
        badge.classList.remove('hidden');
        badge.classList.add('inline-flex');
      } else {
        badge.classList.add('hidden');
        badge.classList.remove('inline-flex');
      }
    }

    function activeCoupons() {
      const list = readJSON('psa_coupons', []);
      if (!Array.isArray(list)) return [];
      return list.filter((c) => {
        if (!c || typeof c !== 'object' || !c.code || c.used) return false;
        if (c.expires) {
          const t = Date.parse(c.expires);
          if (!isNaN(t) && t < Date.now()) return false;
        }
        return true;
      });
    }

    function getPoints() {
      const n = Math.floor(Number(localStorage.getItem('psa_points')));
      return isFinite(n) && n > 0 ? n : 0;
    }

    function renderStats() {
      $('statWishlist').textContent = getWishlist().length.toLocaleString();
      $('statViewed').textContent = getViewed().length.toLocaleString();
      $('statCoupons').textContent = activeCoupons().length.toLocaleString();
      $('statPoints').textContent = getPoints().toLocaleString();
    }

    /* ---------- Avatar upload ---------- */
    function toAvatarDataUrl(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const size = 256;
            const side = Math.min(img.naturalWidth, img.naturalHeight);
            if (!side) throw new Error('empty image');
            const sx = (img.naturalWidth - side) / 2;
            const sy = (img.naturalHeight - side) / 2;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } catch (e) {
            reject(e);
          } finally {
            URL.revokeObjectURL(url);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('unreadable'));
        };
        img.src = url;
      });
    }

    // Stores the avatar on the logged-in user and on the matching record in the user list,
    // so it is still there after the next sign in.
    function saveAvatar(dataUrl) {
      const prevCurrent = localStorage.getItem('psa_current_user');
      const prevUsers = localStorage.getItem('psa_rbac_users');
      try {
        const user = getUser();
        if (!user) throw new Error('not signed in');
        user.avatarUrl = dataUrl;
        localStorage.setItem('psa_current_user', JSON.stringify(user));

        const users = readJSON('psa_rbac_users', null);
        if (Array.isArray(users)) {
          const i = users.findIndex((u) => u && u.id === user.id);
          if (i > -1) {
            users[i].avatarUrl = dataUrl;
            localStorage.setItem('psa_rbac_users', JSON.stringify(users));
          }
        }
        return true;
      } catch (e) {
        try {
          if (prevCurrent === null) localStorage.removeItem('psa_current_user'); else localStorage.setItem('psa_current_user', prevCurrent);
          if (prevUsers === null) localStorage.removeItem('psa_rbac_users'); else localStorage.setItem('psa_rbac_users', prevUsers);
        } catch (e2) { /* nothing more to restore */ }
        return false;
      }
    }

    async function handleAvatarFile(file) {
      if (!file) return;
      if (!/^image\//.test(file.type)) {
        notify('Choose an image file (JPG, PNG or WebP).');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        notify('Choose an image smaller than 10 MB.');
        return;
      }
      try {
        const dataUrl = await toAvatarDataUrl(file);
        if (saveAvatar(dataUrl)) {
          renderProfile();
          notify('Profile photo updated.');
        } else {
          notify('The photo could not be saved. Browser storage may be full.');
        }
      } catch (e) {
        notify('This file could not be read as an image. Try a JPG or PNG.');
      }
    }

    /* ---------- Order shortcuts ---------- */
    function buildShortcuts() {
      $('shortcutRow').innerHTML = SHORTCUTS.map((s) => `
        <button type="button" data-filter="${s.key}" aria-pressed="false" class="group flex flex-col items-center gap-1.5 py-3 px-0.5 rounded-xl cursor-pointer ${FOCUS}">
          <span data-well class="relative w-11 h-11 rounded-lg flex items-center justify-center bg-[#F9F3EA] text-[#4A3333]">
            ${icon(s.icon, 'w-6 h-6')}

          </span>
          <span data-label class="text-xs leading-tight text-center text-[#4A3333]">${esc(s.label)}</span>

    function updateShortcuts() {
      const orders = getOrders();
      document.querySelectorAll('#shortcutRow [data-filter]').forEach((btn) => {
        const key = btn.dataset.filter;
        const n = orders.filter((o) => filterKeyOf(o) === key).length;
        const badge = btn.querySelector('[data-badge]');
        badge.textContent = n > 99 ? '99+' : String(n);
        badge.classList.toggle('hidden', n === 0);
        badge.classList.toggle('flex', n > 0);

        const on = activeFilter === key;
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.setAttribute('aria-label', FILTER_LABELS[key] + (n ? ', ' + n + (n === 1 ? ' order' : ' orders') : ''));

        const well = btn.querySelector('[data-well]');
        well.classList.toggle('bg-[#FFA552]', on);
        well.classList.toggle('text-stone-900', on);
        well.classList.toggle('bg-[#F9F3EA]', !on);
        well.classList.toggle('text-[#4A3333]', !on);
        const label = btn.querySelector('[data-label]');
        label.classList.toggle('font-bold', on);
        label.classList.toggle('text-[#2B1D1D]', on);
        label.classList.toggle('text-[#4A3333]', !on);
      });
    }

    function setFilter(key, opts) {
      activeFilter = FILTER_LABELS[key] ? key : 'all';
      showAllOrders = false;
      try {
        const url = new URL(window.location.href);
        if (activeFilter === 'all') url.searchParams.delete('tab'); else url.searchParams.set('tab', activeFilter);
        history.replaceState(null, '', url);
      } catch (e) { /* history is unavailable on some file:// origins */ }
      updateShortcuts();
      renderOrders();
      if (opts && opts.scroll) {
        $('orders').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
        $('orderListHeading').focus({ preventScroll: true });
      }
    }

    /* ---------- Order list ---------- */
    function statusChip(order) {
      const g = orderGroup(order);
      const tone = {
        pending: 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/50 dark:text-amber-300 dark:border-amber-900',
        ship: 'bg-sky-50 text-sky-800 border-sky-200 dark:bg-sky-950/50 dark:text-sky-300 dark:border-sky-900',
        receive: 'bg-orange-50 text-orange-800 border-orange-200 dark:bg-orange-950/50 dark:text-orange-300 dark:border-orange-900',
        delivered: 'bg-emerald-50 text-emerald-800 border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-900',
        refund: 'bg-rose-50 text-rose-800 border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-900'
      }[g] || 'bg-stone-100 text-stone-700 border-stone-200 dark:bg-stone-800 dark:text-stone-300 dark:border-stone-700';
      return `<span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-bold ${tone}">${esc(order.status || 'Unknown')}</span>`;
    }

    function orderCard(ord) {
      const id = String(ord.id || '');
      const idQ = encodeURIComponent(id);
      const items = Array.isArray(ord.items) ? ord.items : [];
      const payHref = 'order-detail--buyer-pending.html?order=' + idQ +
        '&usd=' + encodeURIComponent(ord.totalUSD != null ? ord.totalUSD : '') +
        '&khr=' + encodeURIComponent(ord.totalKHR != null ? ord.totalKHR : '');

                <div class="min-w-0 flex-1">
                  <div class="text-sm font-semibold text-[#2B1D1D] truncate">${esc(it.title)}</div>

                </div>
                <div class="text-sm font-bold text-[#2B1D1D] tabular-nums">$${(Number(it.priceUSD) * Number(it.quantity) || 0).toFixed(2)}</div>

              <span class="text-stone-500">Total</span>
              <span class="font-extrabold text-[#2B1D1D] tabular-nums">$${esc(ord.totalUSD)}</span>

      $('toolGrid').innerHTML = TOOLS.map((t) => {

    /* ---------- Coupons dialog ---------- */

            </div>`).join('')
        : '<p class="text-sm text-stone-500">You have no coupons right now.</p>';

    /* ---------- You may also like ---------- */
    function recommend(limit) {
      const viewed = getViewed();
      const wish = getWishlist();
      const cart = getCart();
      const orders = getOrders();
      const byId = new Map(ACCESSORIES_PRODUCTS.map((p) => [p.id, p]));

      const score = {};
      const bump = (id, w) => {
        const p = byId.get(id);
        if (p) score[p.category] = (score[p.category] || 0) + w;
      };
      viewed.forEach((v) => bump(v.id, 3));
      wish.forEach((id) => bump(id, 2));
      orders.forEach((o) => (Array.isArray(o.items) ? o.items : []).forEach((it) => bump(it.id, 2)));
      cart.forEach((it) => bump(it.id, 1));

      const owned = new Set();
      orders.forEach((o) => (Array.isArray(o.items) ? o.items : []).forEach((it) => owned.add(it.id)));
      cart.forEach((it) => owned.add(it.id));
      const seen = new Set(viewed.map((v) => v.id));

      const byScore = (a, b) => (score[b.category] || 0) - (score[a.category] || 0);
      const fresh = ACCESSORIES_PRODUCTS.filter((p) => !owned.has(p.id) && !seen.has(p.id)).sort(byScore);
      const already = ACCESSORIES_PRODUCTS.filter((p) => !owned.has(p.id) && seen.has(p.id)).sort(byScore);

      const basis = viewed.length ? 'viewed' : (Object.keys(score).length ? 'activity' : 'none');
      return { items: fresh.concat(already).slice(0, limit), basis };
    }

    function renderRecs() {
      const { items, basis } = recommend(8);
      $('recsSection').classList.toggle('hidden', items.length === 0);
      $('recsBasis').textContent = {
        viewed: 'Chosen from the categories of items you viewed.',
        activity: 'Chosen from your wishlist, bag and orders.',
        none: 'You have not viewed anything yet. Here is a start from the catalog.'

      $('recsGrid').innerHTML = items.map((p) => `
        <article class="flex flex-col rounded-xl overflow-hidden bg-white dark:bg-[#1A1A22] border border-[#EFE4D6] dark:border-[#2D2D38]">
          <a href="product-detail.html?id=${encodeURIComponent(p.id)}" class="block aspect-square bg-[#F9F3EA] ${FOCUS}" tabindex="-1" aria-hidden="true">
            <img src="${esc(p.image)}" alt="" loading="lazy" class="w-full h-full object-cover" />

          <div class="p-3 flex flex-col gap-2 flex-1">
            <a href="product-detail.html?id=${encodeURIComponent(p.id)}" class="text-sm font-semibold text-[#2B1D1D] line-clamp-2 min-h-[2.5rem] hover:underline ${FOCUS}">${esc(p.title)}</a>
            <div class="text-sm font-extrabold text-[#2B1D1D] tabular-nums">${esc(formatPrice(p.priceUSD, p.priceKHR))}</div>
            <div class="flex gap-2 mt-auto">
              <button type="button" data-add="${esc(p.id)}" ${p.inStock === false ? 'disabled' : ''} class="flex-1 h-9 rounded-lg bg-[#FFA552] hover:bg-[#E88C35] disabled:opacity-50 disabled:cursor-not-allowed text-stone-900 text-xs font-bold cursor-pointer ${FOCUS}">${p.inStock === false ? 'Sold out' : 'Add to Bag'}</button>
              <button type="button" data-wish="${esc(p.id)}" data-wishlist-id="${esc(p.id)}" class="w-9 h-9 shrink-0 rounded-lg border border-[#EFE4D6] dark:border-[#2D2D38] text-stone-400 flex items-center justify-center cursor-pointer ${FOCUS}" aria-label="Save to Wishlist" title="Save to Wishlist">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">${ICONS.heart}</svg>
              </button>
            </div>
          </div>
        </article>`).join('');

      updateWishlistUI();
    }

    /* ---------- Wiring ---------- */
    function refreshAll() {
      renderProfile();
      renderStats();
      updateShortcuts();
      renderOrders();
      renderRecs();
    }

    document.addEventListener('DOMContentLoaded', () => {
      buildShortcuts();
      buildTools();

      const tab = new URLSearchParams(window.location.search).get('tab');
      if (tab && FILTER_LABELS[tab]) activeFilter = tab;

      refreshAll();

      $('avatarBtn').addEventListener('click', () => $('avatarInput').click());
      $('avatarInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        handleAvatarFile(file);
      });

      $('shortcutRow').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filter]');
        if (btn) setFilter(btn.dataset.filter, { scroll: true });
      });
      $('allOrdersBtn').addEventListener('click', () => setFilter('all', { scroll: true }));
      $('clearFilterBtn').addEventListener('click', () => setFilter('all'));

      $('ordersContainer').addEventListener('click', (e) => {
        if (e.target.closest('#moreOrdersBtn')) {
          showAllOrders = true;
          renderOrders();
        }
      });

      document.addEventListener('click', (e) => {
        if (e.target.closest('[data-open-coupons]')) openCoupons();
        if (e.target.closest('[data-close-coupons]')) closeCoupons();
      });
      $('couponDialog').addEventListener('click', (e) => {
        if (e.target === $('couponDialog')) closeCoupons();
      });

      $('recsGrid').addEventListener('click', (e) => {
        const add = e.target.closest('[data-add]');
        if (add && !add.disabled) {
          addToCart(add.dataset.add, 1);
          return;
        }
        const wish = e.target.closest('[data-wish]');
        if (wish) {
          toggleWishlist(wish.dataset.wish, e);
          renderStats();
        }
      });

      // Refresh when returning with the back button or when another tab changes the data.
      window.addEventListener('pageshow', (e) => { if (e.persisted) refreshAll(); });
      window.addEventListener('storage', refreshAll);
    });
  </script>
</body>
</html>
