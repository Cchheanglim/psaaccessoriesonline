<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>My Account — PsaOnline</title>
  <meta name="description" content="View your order history, delivery statuses, and saved addresses on PsaOnline." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/taobao.css" />
</head>
<body class="bg-[#F5F5F5] text-[#333333] font-sans min-h-screen flex flex-col antialiased selection:bg-[#FF5000] selection:text-white pb-mobile-nav">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-[#121215]/95 backdrop-blur-md border-b border-[#EDEDED] dark:border-[#2D2D38] transition-all duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2.5 sm:gap-3 group" title="Psa Accessories Online">
        <img 
          src="assets/images/psa-accessories-online-logo.svg" 
          alt="Psa Accessories Online Logo" 
          class="h-9 sm:h-11 w-auto object-contain group-hover:scale-105 transition-transform duration-300 drop-shadow-xs"
        />
        <span class="text-lg sm:text-xl font-black text-[#333333] dark:text-white">Psa<span class="text-[#FF5000]">Online</span></span>
      </a>

      <div class="flex items-center gap-3 sm:gap-4 text-xs font-bold">
        <a href="products.html" class="text-[#FF5000] hover:underline">All Drops</a>
        <a href="wishlist.html" class="text-rose-500 hover:underline flex items-center gap-1">
          <span>💖</span>
          <span>Wishlist</span>
        </a>
        <a href="cart.html" class="text-[#FF5000] hover:underline">Bag</a>
        <a href="login.html" class="text-red-500 hover:underline">Sign Out</a>
      </div>
    </div>
  </header>

  <!-- Dashboard Body -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 flex-1 w-full space-y-6 sm:space-y-8">

    <!-- Profile Banner in Cotton Beige -->
    <div class="reveal-init bg-white dark:bg-[#1A1A22] rounded-3xl border border-[#EDEDED] dark:border-[#2D2D38] p-6 sm:p-8 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 text-center sm:text-left">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#333333] to-[#FF5000] text-white font-black text-xl flex items-center justify-center shadow-md">
          SC
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black text-[#333333] dark:text-white">Sophea Chhum</h1>
          <div class="text-xs text-stone-500 dark:text-stone-400">sophea.accessories@gmail.com &bull; 012 345 678</div>
          <div class="text-[11px] text-[#FF5000] font-black mt-0.5">Primary Delivery: House 42, St 240, Daun Penh, Phnom Penh</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="wishlist.html" class="btn-press px-4 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 font-black text-xs border border-rose-200 dark:border-rose-900 transition-all flex items-center gap-1.5 shadow-xs">
          <span>💖</span>
          <span>My Wishlist (<span class="wishlist-count-badge">0</span>)</span>
        </a>
        <a href="products.html" class="btn-press px-5 py-2.5 rounded-xl bg-[#FF5000] hover:bg-[#E64500] text-white font-black text-xs shadow-xs transition-all">
          Browse Drops &rarr;
        </a>
      </div>
    </div>

    <!-- Active Orders Section -->
    <div class="reveal-init delay-100 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base sm:text-lg font-black text-[#333333]">Order History & Deliveries</h2>
        <span class="text-xs text-stone-400">Real-time status updates</span>
      </div>

      <div id="ordersContainer" class="space-y-4">
        <!-- Rendered from localStorage -->
      </div>
    </div>

  </main>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/taobao.js"></script>
  <script>
    function renderBuyerOrders() {
      const container = document.getElementById('ordersContainer');
      let orders = [];
      try {
        orders = JSON.parse(localStorage.getItem('psa_orders') || '[]');
      } catch (e) {
        orders = [];
      }

      if (orders.length === 0) {
        orders = [
          {
            id: 'PSA-889104',
            date: 'Today, 1:15 PM',
            totalUSD: '18.50',
            totalKHR: '75,850',
            status: 'On The Way',
            items: [
              {
                title: 'Silver Chrome Star Pendant Necklace',
                image: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=600&q=80',
                priceUSD: 6.50,
                quantity: 1
              },
              {
                title: 'Puffy Cloud Quilted Nylon Shoulder Bag',
                image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80',
                priceUSD: 12.00,
                quantity: 1
              }
            ]
          }
        ];
      }

      container.innerHTML = orders.map(ord => `
        <div class="bg-white rounded-3xl border border-[#EDEDED] p-5 sm:p-6 shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#FFF3EC] pb-3">
            <div>
              <div class="text-xs font-black text-[#333333]">Order #${ord.id}</div>
              <div class="text-[11px] text-stone-400">${ord.date} &bull; Phnom Penh Courier</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider ${
                ord.status === 'On The Way' ? 'bg-[#FFF3EC] text-[#FF5000] border border-[#FF5000]' :
                ord.status === 'Payment Pending' ? 'bg-amber-50 text-amber-700 border border-amber-200' :
                'bg-emerald-50 text-emerald-700 border border-emerald-200'
              }">
                ${ord.status}
              </span>
              <a href="order-detail.html?order=${ord.id}" class="px-3.5 py-1.5 rounded-xl bg-[#FF5000] hover:bg-[#E64500] text-white text-xs font-black transition">
                View Receipt &rarr;
              </a>
            </div>
          </div>

          <div class="space-y-2">
            ${(ord.items || []).map(it => `
              <div class="flex items-center gap-3 text-xs">
                <img src="${it.image}" class="w-10 h-10 rounded-lg object-cover border border-[#EDEDED]" />
                <div class="flex-1 min-w-0">
                  <div class="font-bold text-[#333333] truncate">${it.title}</div>
                  <div class="text-[11px] text-stone-500">Qty: ${it.quantity}</div>
                </div>
                <div class="font-black text-[#333333]">$${(it.priceUSD * it.quantity).toFixed(2)}</div>
              </div>
            `).join('')}
          </div>

          <div class="border-t border-[#FFF3EC] pt-3 flex justify-between items-baseline text-xs">
            <span class="text-stone-500">Total Paid:</span>
            <div class="text-right">
              <span class="font-black text-sm text-[#333333]">$${ord.totalUSD}</span>
              <span class="text-[11px] text-[#FF5000] font-black block sm:inline sm:ml-1">(${ord.totalKHR} ៛)</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBuyerOrders();
    });
  </script>
</body>
</html>
