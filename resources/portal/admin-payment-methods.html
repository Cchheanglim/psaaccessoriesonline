<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment methods — PsaOnline Staff</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="The ways customers can pay at checkout." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { sorbet: '#FFA552', cotton: '#F9F3EA', espresso: '#2B1D1D' } } } };</script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <style>
    .qr-thumb { width: 44px; height: 44px; padding: 3px; border-radius: 8px; border: 1px solid var(--pt-line); background: #fff; cursor: zoom-in; }
    .qr-thumb img { width: 100%; height: 100%; object-fit: contain; }
    tr.is-off td:not(:last-child) { opacity: .6; }
  </style>
</head>
<body class="pt" data-portal="payments">
  <div class="pt-frame">
    <main class="pt-main">
      <div class="pt-head">
        <div class="pt-head__text">
          <h1>Payment methods</h1>
          <p>The ways customers can pay at checkout. Turn one off to hide it from checkout without losing its details.</p>
        </div>
        <div class="pt-head__actions">
          <a href="payment-method-form.html" class="pt-btn pt-btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add method
          </a>
        </div>
      </div>

      <section class="pt-panel" aria-label="Payment methods">
        <div class="pt-table-wrap">
          <table class="pt-table pt-table--stack">
            <thead>
              <tr>
                <th scope="col">Method</th>
                <th scope="col">Type</th>
                <th scope="col">QR</th>
                <th scope="col">Account</th>
                <th scope="col">At checkout</th>
                <th scope="col" class="is-end"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="methodsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="qrDialog" class="pt-dialog" aria-labelledby="qrTitle" style="width:min(360px, calc(100vw - 32px))">
    <div class="pt-dialog__head">
      <h2 id="qrTitle">Payment QR</h2>
      <button type="button" class="pt-btn pt-btn--ghost pt-btn--icon" data-close-qr aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="pt-panel__body" style="text-align:center">
      <div id="qrHolder" style="display:inline-block;padding:10px;background:#fff;border-radius:12px;border:1px solid var(--pt-line)"></div>
      <p class="pt-muted" style="font-size:13px;margin:12px 0 0">Customers scan this in their bank app at checkout.</p>
    </div>
  </dialog>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/rbac.js"></script>
  <script src="assets/js/portal-shell.js"></script>
  <script>
    const TYPES = { khqr: ['KHQR', 'violet'], bank: ['Bank transfer', 'sky'], cod: ['Cash', 'green'], other: ['Other', 'grey'] };
    const BUILT_IN_CODES = ['bakong_khqr', 'aba_pay', 'acleda_khqr', 'visa_card', 'cod'];
    const EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

    // A QR can be stored as an uploaded image, a link, or KHQR text (rendered via a QR image service).
    function qrImageUrl(m, size) {
      if (!m.qrData) return '';
      if (/^(data:image\/|https?:\/\/)/.test(m.qrData)) return m.qrData;
      return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(m.qrData)}`;
    }

    function renderMethodsTable() {
      const tbody = document.getElementById('methodsTableBody');
      const methods = PSA.online ? PSA.paymentMethods : [];
      if (!methods.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="pt-empty"><h3>${PSA.online ? 'No payment methods yet' : 'The server is offline'}</h3><p>${PSA.online ? 'Add one so customers can pay at checkout.' : 'Start it with php artisan serve to manage payment methods.'}</p></div></td></tr>`;
        return;
      }
      tbody.innerHTML = methods.map(m => {
        const [typeLabel, tone] = TYPES[m.type] || TYPES.other;
        const qr = qrImageUrl(m, 100);
        const builtIn = BUILT_IN_CODES.includes(m.code);
        return `
          <tr class="${m.isActive ? '' : 'is-off'}">
            <td><span class="pt-strong">${psaEsc(m.name)}</span><span class="pt-sub">${psaEsc(m.description || '')}</span></td>
            <td data-label="Type"><span class="pt-badge pt-badge--${tone} pt-badge--plain">${typeLabel}</span></td>
            <td data-label="QR">${qr ? `<button type="button" class="qr-thumb" data-qr="${m.id}" aria-label="Show the ${psaEsc(m.name)} QR code"><img src="${psaEsc(qr)}" alt=""></button>` : '<span class="pt-faint">—</span>'}</td>
            <td data-label="Account"><span class="pt-mono">${psaEsc(m.accountNumber || '—')}</span>${m.accountName ? `<span class="pt-sub">${psaEsc(m.accountName)}</span>` : ''}</td>
            <td data-label="At checkout">
              <span style="display:inline-flex;align-items:center;gap:10px">
                <label class="pt-switch"><input type="checkbox" data-toggle="${m.id}" ${m.isActive ? 'checked' : ''} aria-label="Show ${psaEsc(m.name)} at checkout"><span></span></label>
                <span class="pt-muted" style="font-size:13px;font-weight:600">${m.isActive ? 'On' : 'Off'}</span>
              </span>
            </td>
            <td class="is-end"><div class="pt-actions">
              <a href="payment-method-form.html?id=${m.id}" class="pt-btn pt-btn--secondary pt-btn--sm">${EDIT}Edit</a>
              ${builtIn ? '' : `<button type="button" class="pt-btn pt-btn--ghost pt-btn--sm pt-btn--icon" data-delete="${m.id}" aria-label="Delete ${psaEsc(m.name)}">${TRASH}</button>`}
            </div></td>
          </tr>`;
      }).join('');
    }

    async function toggleMethodStatus(checkbox) {
      const id = Number(checkbox.dataset.toggle);
      checkbox.disabled = true;
      try {
        const { paymentMethod } = await psaApi('PATCH', `/api/admin/payment-methods/${id}`, { isActive: checkbox.checked });
        PSA.paymentMethods = PSA.paymentMethods.map(m => (m.id === paymentMethod.id ? paymentMethod : m));
        renderMethodsTable();
        showRBACToast(`${psaEsc(paymentMethod.name)} is ${paymentMethod.isActive ? 'on' : 'off'} at checkout.`, 'success');
      } catch (err) {
        checkbox.checked = !checkbox.checked;
        checkbox.disabled = false;
        showRBACToast(psaEsc(err.message), 'danger');
      }
    }

    async function deleteMethod(id) {
      const m = PSA.paymentMethods.find(x => x.id === id);
      if (!m || !confirm(`Delete "${m.name}"? Customers won't see it at checkout any more.`)) return;
      try {
        await psaApi('DELETE', `/api/admin/payment-methods/${id}`);
        PSA.paymentMethods = PSA.paymentMethods.filter(x => x.id !== id);
        renderMethodsTable();
        showRBACToast(`${psaEsc(m.name)} deleted.`, 'success');
      } catch (err) {
        showRBACToast(psaEsc(err.message), 'danger');
      }
    }

    function showQr(id) {
      const m = PSA.paymentMethods.find(x => x.id === id);
      if (!m) return;
      document.getElementById('qrTitle').textContent = m.name;
      const img = document.createElement('img');
      img.src = qrImageUrl(m, 300);
      img.alt = `${m.name} payment QR code`;
      img.style.cssText = 'width:240px;height:240px;object-fit:contain';
      document.getElementById('qrHolder').replaceChildren(img);
      document.getElementById('qrDialog').showModal();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (ptDenied()) return;
      renderMethodsTable();
      const body = document.getElementById('methodsTableBody');
      body.addEventListener('change', e => { if (e.target.matches('[data-toggle]')) toggleMethodStatus(e.target); });
      body.addEventListener('click', e => {
        const del = e.target.closest('[data-delete]');
        if (del) return deleteMethod(Number(del.dataset.delete));
        const qr = e.target.closest('[data-qr]');
        if (qr) showQr(Number(qr.dataset.qr));
      });
      const dlg = document.getElementById('qrDialog');
      dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close-qr]')) dlg.close(); });
    });
  </script>
</body>
</html>
