<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment method — PsaOnline Staff</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Add or edit a way customers can pay." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { sorbet: '#FFA552', cotton: '#F9F3EA', espresso: '#2B1D1D' } } } };</script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <style>
    .qr-box { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .qr-preview { width: 112px; height: 112px; flex: none; border-radius: 12px; border: 1px solid var(--pt-line); background: #fff; display: grid; place-items: center; overflow: hidden; color: #6B5A55; font-size: 12px; font-weight: 700; text-align: center; }
    .qr-preview img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
  </style>
</head>
<body class="pt" data-portal="payment-method-form" data-portal-parent="payments" data-portal-title="New payment method">
  <div class="pt-frame">
    <main class="pt-main pt-main--narrow">
      <a href="admin-payment-methods.html" class="pt-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Payment methods</a>
      <div class="pt-head">
        <div class="pt-head__text">
          <h1 id="formTitle">New payment method</h1>
          <p>Customers see the name, the account details, your note and the QR code at checkout.</p>
        </div>
      </div>

      <form class="pt-panel" novalidate onsubmit="saveMethod(event)">
        <div class="pt-panel__body">
          <div class="pt-field">
            <label for="methodName" class="pt-label">Name customers see</label>
            <input type="text" id="methodName" name="name" required maxlength="100" placeholder="Bakong KHQR" class="pt-input" />
          </div>
          <div class="pt-row pt-row--2" style="margin-top:16px">
            <div class="pt-field">
              <label for="methodType" class="pt-label">Type</label>
              <select id="methodType" name="type" class="pt-select">
                <option value="khqr" selected>KHQR code</option>
                <option value="bank">Bank transfer (ABA, ACLEDA…)</option>
                <option value="cod">Cash on delivery</option>
                <option value="other">Other wallet</option>
              </select>
            </div>
            <div class="pt-field">
              <label for="accountNumber" class="pt-label">Account number <span class="pt-faint">(optional)</span></label>
              <input type="text" id="accountNumber" name="account" maxlength="50" placeholder="012 345 678" class="pt-input pt-mono" />
            </div>
          </div>

          <div class="pt-field" style="margin-top:20px">
            <span class="pt-label">QR code <span class="pt-faint">(optional)</span></span>
            <div class="qr-box">
              <div class="qr-preview" id="qrPreview">No QR yet</div>
              <div>
                <label class="pt-btn pt-btn--secondary" style="cursor:pointer">
                  <input type="file" id="qrFileInput" accept="image/*" class="sr-only" onchange="previewQr(event)" />
                  Choose picture
                </label>
                <button type="button" class="pt-btn pt-btn--ghost" id="qrRemove" hidden>Remove</button>
                <span class="pt-hint">A clear square picture of the QR from your bank app works best.</span>
              </div>
            </div>
          </div>

          <div class="pt-field" style="margin-top:20px">
            <label for="instructions" class="pt-label">Note for customers <span class="pt-faint">(optional)</span></label>
            <textarea id="instructions" name="instructions" rows="3" maxlength="255" placeholder="Put your order number in the transfer remark." class="pt-textarea"></textarea>
          </div>

          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid var(--pt-line)">
            <span><b style="display:block;font-size:14px">Show at checkout</b><small class="pt-muted" style="font-size:12px">Turn off to hide it from customers for now.</small></span>
            <label class="pt-switch"><input type="checkbox" id="methodEnabled" name="enabled" checked aria-label="Show at checkout"><span></span></label>
          </div>
        </div>
        <div class="pt-panel__foot">
          <span id="methodFormError" class="hidden pt-error" style="margin:0 auto 0 0;align-self:center" role="alert"></span>
          <a href="admin-payment-methods.html" class="pt-btn pt-btn--ghost">Cancel</a>
          <button type="submit" id="methodSaveBtn" class="pt-btn pt-btn--primary">Save method</button>
        </div>
      </form>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/rbac.js"></script>
  <script src="assets/js/portal-shell.js"></script>
  <script>
    const editingMethodId = new URLSearchParams(location.search).get('id');
    let qrData = null;

    function qrImageUrl(data) {
      if (!data) return '';
      if (/^(data:image\/|https?:\/\/)/.test(data)) return data;
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data)}`;
    }

    function showQr() {
      const box = document.getElementById('qrPreview');
      const url = qrImageUrl(qrData);
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'QR code preview';
        box.replaceChildren(img);
      } else {
        box.textContent = 'No QR yet';
      }
      document.getElementById('qrRemove').hidden = !url;
    }

    async function previewQr(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        qrData = await psaImageToDataUrl(file, 600, 0.9);
        showQr();
      } catch (err) {
        showRBACToast(psaEsc(err.message), 'danger');
      }
      event.target.value = '';
    }

    // Same limits as AdminApiController::validatePaymentMethod.
    function validateMethodForm(form) {
      psaClearAllFieldErrors(form);
      let hasError = false;
      const check = (id, message) => { if (message) { psaShowFieldError(id, message); hasError = true; } };
      const tooLong = (id, max, label) => document.getElementById(id).value.trim().length > max ? `${label} must be ${max} characters or fewer.` : null;
      check('methodName', psaValidateMinLength(document.getElementById('methodName').value, 2, 'Name') || tooLong('methodName', 100, 'Name'));
      check('methodType', psaValidateRequired(document.getElementById('methodType').value, 'Type'));
      check('accountNumber', tooLong('accountNumber', 50, 'Account number'));
      check('instructions', tooLong('instructions', 255, 'Note'));
      return !hasError;
    }

    async function saveMethod(e) {
      e.preventDefault();
      const errorEl = document.getElementById('methodFormError');
      const btn = document.getElementById('methodSaveBtn');
      errorEl.classList.add('hidden');
      if (!validateMethodForm(e.target)) return;
      const payload = {
        name: document.getElementById('methodName').value.trim(),
        type: document.getElementById('methodType').value,
        accountNumber: document.getElementById('accountNumber').value.trim() || null,
        description: document.getElementById('instructions').value.trim() || null,
        qrData,
        isActive: document.getElementById('methodEnabled').checked
      };
      psaSetButtonLoading(btn, true, 'Saving…');
      try {
        if (editingMethodId) await psaApi('PATCH', `/api/admin/payment-methods/${encodeURIComponent(editingMethodId)}`, payload);
        else await psaApi('POST', '/api/admin/payment-methods', payload);
        window.location.replace('admin-payment-methods.html');
      } catch (err) {
        psaSetButtonLoading(btn, false);
        if (err.errors) psaApplyServerErrors(e.target, err.errors);
        else {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (ptDenied()) return;
      ['methodName', 'methodType', 'accountNumber', 'instructions'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => psaClearFieldError(el));
      });
      document.getElementById('qrRemove').addEventListener('click', () => { qrData = null; showQr(); });
      if (!editingMethodId) return;
      const m = PSA.paymentMethods.find(x => String(x.id) === editingMethodId);
      if (!m) {
        showRBACToast('That payment method was not found.', 'danger');
        setTimeout(() => { window.location.href = 'admin-payment-methods.html'; }, 900);
        return;
      }
      document.title = `${m.name} — PsaOnline Staff`;
      document.getElementById('formTitle').textContent = m.name;
      const crumb = document.querySelector('.pt-top__crumb b');
      if (crumb) crumb.textContent = m.name;
      document.getElementById('methodName').value = m.name;
      document.getElementById('methodType').value = m.type || 'other';
      document.getElementById('accountNumber').value = m.accountNumber || '';
      document.getElementById('instructions').value = m.description || '';
      document.getElementById('methodEnabled').checked = m.isActive;
      qrData = m.qrData;
      showQr();
    });
  </script>
</body>
</html>
