<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — PsaOnline Staff</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Add or edit an account and choose its role." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { sorbet: '#FFA552', cotton: '#F9F3EA', espresso: '#2B1D1D' } } } };</script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <style>
    .radio-card { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--pt-line); border-radius: 12px; cursor: pointer; flex: 1; }
    .radio-card:has(input:checked) { border-color: var(--pt-accent); background: var(--pt-accent-soft); }
    .radio-card:has(input:disabled) { cursor: default; opacity: .7; }
    .radio-card b { display: block; font-size: 14px; }
    .radio-card small { display: block; font-size: 12px; color: var(--pt-ink-2); }
  </style>
</head>
<body class="pt" data-portal="user-form" data-portal-parent="users" data-portal-title="New account">
  <div class="pt-frame">
    <main class="pt-main pt-main--narrow">
      <a href="admin-users.html" class="pt-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Staff &amp; roles</a>
      <div class="pt-head">
        <div class="pt-head__text">
          <h1 id="formTitle">New account</h1>
          <p id="formSub">Give someone a staff role to let them into this portal, or make a customer account.</p>
        </div>
      </div>

      <form class="pt-panel" novalidate onsubmit="saveUser(event)">
        <div class="pt-panel__body">
          <div class="pt-row pt-row--2">
            <div class="pt-field">
              <label for="userName" class="pt-label">Full name</label>
              <input type="text" id="userName" name="name" required maxlength="100" placeholder="Kosal Meng" autocomplete="off" class="pt-input" />
            </div>
            <div class="pt-field">
              <label for="userEmail" class="pt-label">Email</label>
              <input type="email" id="userEmail" name="email" required maxlength="255" placeholder="kosal@psaonline.store" autocomplete="off" class="pt-input" />
            </div>
          </div>

          <div class="pt-field" style="margin-top:20px">
            <label for="userRole" class="pt-label">Role</label>
            <select id="userRole" name="role" class="pt-select"></select>
            <span class="pt-hint" id="roleHint"></span>
            <span class="pt-hint" id="roleLink" hidden><a href="admin-users.html#roles" style="color:var(--pt-accent-ink);font-weight:700">See or change what each role can do</a></span>
          </div>

          <div class="pt-field" style="margin-top:20px">
            <span class="pt-label">Account</span>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <label class="radio-card"><input type="radio" name="status" value="Active" checked /><span><b>Active</b><small>Can sign in.</small></span></label>
              <label class="radio-card"><input type="radio" name="status" value="Suspended" /><span><b>Suspended</b><small>Can't sign in until you turn it back on.</small></span></label>
            </div>
          </div>

          <div class="pt-field" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--pt-line)">
            <label for="newPassword" id="passwordLabel" class="pt-label">New password <span class="pt-faint">(leave empty to keep the current one)</span></label>
            <input type="password" id="newPassword" name="password" minlength="6" autocomplete="new-password" class="pt-input" />
          </div>
        </div>
        <div class="pt-panel__foot">
          <span id="userFormError" class="hidden pt-error" style="margin:0 auto 0 0;align-self:center" role="alert"></span>
          <a href="admin-users.html" class="pt-btn pt-btn--ghost">Cancel</a>
          <button type="submit" id="userSaveBtn" class="pt-btn pt-btn--primary">Save account</button>
        </div>
      </form>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/rbac.js"></script>
  <script src="assets/js/portal-shell.js"></script>
  <script>
    const editingUserId = new URLSearchParams(location.search).get('id');
    const me = getCurrentUser();
    const roles = (PSA.roles && PSA.roles.length ? PSA.roles : [
      { name: 'Admin', description: 'Full access' }, { name: 'Staff', description: 'Runs orders, products and stock' }, { name: 'Buyer', description: 'Customer account' }
    ]).filter(r => me.role === 'Admin' || r.name !== 'Admin');

    function fillRoles(selected) {
      const select = document.getElementById('userRole');
      select.innerHTML = roles.map(r => `<option value="${psaEsc(r.name)}">${psaEsc(r.name)}${r.name === 'Buyer' ? ' (customer)' : ''}</option>`).join('');
      select.value = selected && roles.some(r => r.name === selected) ? selected : (roles.find(r => r.name === 'Staff') || roles[0]).name;
      describeRole();
    }

    function describeRole() {
      const r = roles.find(x => x.name === document.getElementById('userRole').value);
      document.getElementById('roleHint').textContent = r ? (r.description || (r.name === 'Buyer' ? 'Shops in the store. No portal access.' : '')) : '';
      document.getElementById('roleLink').hidden = me.role !== 'Admin';
    }

    function validateUserForm(form) {
      psaClearAllFieldErrors(form);
      let hasError = false;
      const check = (id, message) => { if (message) { psaShowFieldError(id, message); hasError = true; } };
      check('userName', psaValidateMinLength(document.getElementById('userName').value, 2, 'Full name'));
      check('userEmail', psaValidateEmail(document.getElementById('userEmail').value));
      check('userRole', psaValidateRequired(document.getElementById('userRole').value, 'Role'));
      // A new account needs a password; when editing, leaving it empty keeps the old one.
      const password = document.getElementById('newPassword').value;
      if (password || !editingUserId) check('newPassword', psaValidatePassword(password, 6));
      return !hasError;
    }

    async function saveUser(e) {
      e.preventDefault();
      const errorEl = document.getElementById('userFormError');
      const btn = document.getElementById('userSaveBtn');
      errorEl.classList.add('hidden');
      if (!validateUserForm(e.target)) return;
      const payload = {
        name: document.getElementById('userName').value.trim(),
        email: document.getElementById('userEmail').value.trim(),
        role: document.getElementById('userRole').value,
        status: document.querySelector('input[name="status"]:checked').value,
        password: document.getElementById('newPassword').value || null
      };
      psaSetButtonLoading(btn, true, 'Saving…');
      try {
        if (editingUserId) await psaApi('PATCH', `/api/admin/users/${encodeURIComponent(editingUserId)}`, payload);
        else await psaApi('POST', '/api/admin/users', payload);
        window.location.replace('admin-users.html');
      } catch (err) {
        psaSetButtonLoading(btn, false);
        if (err.errors) psaApplyServerErrors(e.target, err.errors);
        if (!err.errors || err.errors.role || err.errors.status) {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (ptDenied()) return;
      ['userName', 'userEmail', 'userRole', 'newPassword'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => psaClearFieldError(el));
      });
      document.getElementById('userRole').addEventListener('change', describeRole);

      if (!editingUserId) {
        fillRoles();
        document.getElementById('passwordLabel').textContent = 'Password (at least 6 characters)';
        document.getElementById('newPassword').required = true;
        return;
      }
      const user = getRBACUsers().find(u => String(u.id) === editingUserId);
      if (!user) {
        showRBACToast('That account was not found.', 'danger');
        setTimeout(() => { window.location.href = 'admin-users.html'; }, 900);
        return;
      }
      if (!roles.some(r => r.name === user.role)) roles.push({ name: user.role, description: '' });
      fillRoles(user.role);
      document.title = `${user.name} — PsaOnline Staff`;
      document.getElementById('formTitle').textContent = user.name;
      document.getElementById('formSub').textContent = `${user.email} · joined ${user.created || '—'}`;
      const crumb = document.querySelector('.pt-top__crumb b');
      if (crumb) crumb.textContent = user.name;
      document.getElementById('userName').value = user.name;
      document.getElementById('userEmail').value = user.email;
      const status = document.querySelector(`input[name="status"][value="${user.status === 'Suspended' ? 'Suspended' : 'Active'}"]`);
      if (status) status.checked = true;
      // Nobody can change their own role or suspend themselves (the server refuses it too).
      if (String(user.id) === String(me.id)) {
        document.getElementById('userRole').disabled = true;
        document.querySelectorAll('input[name="status"]').forEach(r => { r.disabled = true; });
        document.getElementById('roleHint').textContent = 'This is your own account, so another Admin has to change its role.';
      }
    });
  </script>
</body>
</html>
