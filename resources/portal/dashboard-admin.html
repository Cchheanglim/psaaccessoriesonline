<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — PsaOnline Staff</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Sales, orders and what needs doing today." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { sorbet: '#FFA552', cotton: '#F9F3EA', espresso: '#2B1D1D' } } } };</script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <style>
    .todo { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--pt-line); color: inherit; text-decoration: none; transition: background-color .12s ease; }
    .todo:last-child { border-bottom: 0; }
    .todo:hover { background: var(--pt-sunken); }
    .todo__n { min-width: 44px; height: 44px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--pt-sunken); color: var(--pt-ink-2); }
    .todo.is-hot .todo__n { background: var(--pt-accent); color: #2B1D1D; }
    .todo b { display: block; font-size: 14px; }
    .todo small { display: block; font-size: 12px; color: var(--pt-ink-2); }
    .todo svg { width: 18px; height: 18px; margin-left: auto; color: var(--pt-ink-3); flex: none; }

    .chart { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: 6px; height: 220px; padding: 8px 4px 0; border-bottom: 1px solid var(--pt-line-strong); background-image: linear-gradient(to top, var(--pt-line) 1px, transparent 1px); background-size: 100% 25%; }
    .chart__bar { position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
    .chart__bar span { display: block; min-height: 2px; border-radius: 6px 6px 2px 2px; background: var(--pt-primary); opacity: .9; transition: height .3s cubic-bezier(.16,1,.3,1), opacity .15s ease; }
    .chart__bar.is-zero span { background: var(--pt-line-strong); }
    .chart__bar:hover span { opacity: 1; background: var(--pt-accent); }
    .chart__bar:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 6px 8px; border-radius: 8px; background: var(--pt-ink); color: var(--pt-bg); font-size: 12px; font-weight: 700; z-index: 2; pointer-events: none; }
    .chart-axis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; padding: 6px 4px 0; font-size: 11px; color: var(--pt-ink-3); font-weight: 600; text-align: center; }
    .chart-axis span { overflow: hidden; white-space: nowrap; }

    .share { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
    .share + .share { margin-top: 14px; }
    .share b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .share em { font-style: normal; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .share i { grid-column: 1 / -1; display: block; height: 6px; border-radius: 99px; background: var(--pt-sunken); overflow: hidden; }
    .share i::after { content: ''; display: block; height: 100%; width: var(--w); border-radius: 99px; background: var(--pt-primary); }
  </style>
</head>
<body class="pt" data-portal="dashboard">
  <div class="pt-frame">
    <main class="pt-main">
      <div class="pt-head">
        <div class="pt-head__text">
          <h1 id="greeting">Dashboard</h1>
          <p id="periodText">How the shop is doing.</p>
        </div>
        <div class="pt-head__actions">
          <div class="pt-seg" id="rangeSeg" aria-label="Period">
            <button type="button" data-range="today" aria-pressed="false">Today</button>
            <button type="button" data-range="7d" aria-pressed="true">7 days</button>
            <button type="button" data-range="30d" aria-pressed="false">30 days</button>
            <button type="button" data-range="year" aria-pressed="false">This year</button>
          </div>
          <button type="button" class="pt-btn pt-btn--secondary" id="exportBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <div class="pt-stack">
        <dl class="pt-stats" id="stats"></dl>

        <div class="pt-grid pt-grid--main-side">
          <section class="pt-panel" aria-labelledby="chartTitle">
            <div class="pt-panel__head">
              <div><h2 class="pt-section-title" id="chartTitle">Sales</h2><p class="pt-section-sub" id="chartSub"></p></div>
            </div>
            <div class="pt-panel__body">
              <div class="chart" id="chart" role="img"></div>
              <div class="chart-axis" id="chartAxis" aria-hidden="true"></div>
            </div>
          </section>

          <section class="pt-panel" aria-labelledby="todoTitle">
            <div class="pt-panel__head"><div><h2 class="pt-section-title" id="todoTitle">Needs attention</h2><p class="pt-section-sub">Right now, whatever the period.</p></div></div>
            <div id="todo"></div>
          </section>
        </div>

        <div class="pt-grid pt-grid--main-side">
          <section class="pt-panel" aria-labelledby="topTitle">
            <div class="pt-panel__head">
              <div><h2 class="pt-section-title" id="topTitle">Best sellers</h2><p class="pt-section-sub">By sales in this period.</p></div>
              <a href="admin-products.html" class="pt-btn pt-btn--ghost pt-btn--sm">All products</a>
            </div>
            <div class="pt-table-wrap">
              <table class="pt-table pt-table--stack">
                <thead><tr><th scope="col">Product</th><th scope="col" class="is-num">Sold</th><th scope="col" class="is-num">Sales</th><th scope="col" class="is-num">In stock</th></tr></thead>
                <tbody id="topBody"></tbody>
              </table>
            </div>
          </section>

          <div class="pt-stack">
            <section class="pt-panel" aria-labelledby="catTitle">
              <div class="pt-panel__head"><h2 class="pt-section-title" id="catTitle">Sales by category</h2></div>
              <div class="pt-panel__body" id="categories"></div>
            </section>
            <section class="pt-panel" aria-labelledby="payTitle">
              <div class="pt-panel__head"><h2 class="pt-section-title" id="payTitle">How customers paid</h2></div>
              <div class="pt-panel__body" id="payments"></div>
            </section>
          </div>
        </div>

        <section class="pt-panel" aria-labelledby="recentTitle">
          <div class="pt-panel__head">
            <div><h2 class="pt-section-title" id="recentTitle">Latest orders</h2></div>
            <a href="admin-orders.html?show=all" class="pt-btn pt-btn--ghost pt-btn--sm">All orders</a>
          </div>
          <div class="pt-table-wrap">
            <table class="pt-table pt-table--stack">
              <thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col" class="is-num">Total</th><th scope="col">Status</th></tr></thead>
              <tbody id="recentBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/rbac.js"></script>
  <script src="assets/js/portal-shell.js"></script>
  <script>
    const STATUS_TONE = {
      'Payment Pending': 'amber', 'Slip Uploaded': 'amber', 'Paid (demo)': 'amber', 'Payment Failed': 'red',
      'Processing': 'violet', 'Out for delivery': 'sky', 'Delivered': 'green', 'Cancelled': 'red', 'Refunded': 'grey'
    };
    const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>';
    let range = '7d';

    const money = v => '$' + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const allOrders = () => (PSA.online ? PSA.orders : JSON.parse(localStorage.getItem('psa_orders') || '[]'));
    const products = () => (PSA.online ? PSA.products : (typeof ACCESSORIES_PRODUCTS !== 'undefined' ? ACCESSORIES_PRODUCTS : []));
    const dateOf = o => new Date(o.createdAt || o.date || Date.now());
    const counts = o => o.orderStatus !== 'cancelled'; // sales leave out cancelled orders

    function startOf(key) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      if (key === '7d') d.setDate(d.getDate() - 6);
      if (key === '30d') d.setDate(d.getDate() - 29);
      if (key === 'year') d.setMonth(0, 1);
      return d;
    }

    function inRange() {
      const from = startOf(range);
      return allOrders().filter(o => dateOf(o) >= from);
    }

    // Chart buckets: hours today, days for 7 / 30 days, months this year.
    function buckets(orders) {
      const from = startOf(range);
      const list = [];
      if (range === 'today') {
        for (let h = 0; h < 24; h += 3) list.push({ label: `${h}:00`, tip: `${h}:00–${h + 3}:00`, test: d => d.getHours() >= h && d.getHours() < h + 3, sum: 0, n: 0 });
      } else if (range === 'year') {
        for (let m = 0; m <= new Date().getMonth(); m++) {
          const name = new Date(2000, m, 1).toLocaleDateString([], { month: 'short' });
          list.push({ label: name, tip: name, test: d => d.getMonth() === m && d.getFullYear() === from.getFullYear(), sum: 0, n: 0 });
        }
      } else {
        const days = range === '7d' ? 7 : 30;
        for (let i = 0; i < days; i++) {
          const day = new Date(from);
          day.setDate(from.getDate() + i);
          const label = range === '7d' ? day.toLocaleDateString([], { weekday: 'short' }) : (i % 5 === 0 ? day.getDate() : '');
          list.push({ label, tip: day.toLocaleDateString([], { day: 'numeric', month: 'short' }), test: d => d.toDateString() === day.toDateString(), sum: 0, n: 0 });
        }
      }
      orders.filter(counts).forEach(o => {
        const b = list.find(x => x.test(dateOf(o)));
        if (b) { b.sum += Number(o.totalUSD || 0); b.n++; }
      });
      return list;
    }

    function render() {
      const orders = inRange();
      const sold = orders.filter(counts);
      const sales = sold.reduce((s, o) => s + Number(o.totalUSD || 0), 0);
      const items = sold.reduce((s, o) => s + (o.items || []).reduce((n, i) => n + Number(i.quantity || 0), 0), 0);
      const discounts = sold.reduce((s, o) => s + Number(o.discountUSD || 0) + Number(o.memberDiscountUSD || 0), 0);
      const promoUses = sold.filter(o => o.promoCode).length;
      const cancelled = orders.length - sold.length;
      const label = { today: 'today', '7d': 'in the last 7 days', '30d': 'in the last 30 days', year: 'this year' }[range];

      const hour = new Date().getHours();
      const first = String((PSA.user && PSA.user.name) || '').split(' ')[0];
      document.getElementById('greeting').textContent = `${hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening'}${first ? ', ' + first : ''}`;
      document.getElementById('periodText').textContent = `Sales ${label}. Cancelled orders are left out.`;

      document.getElementById('stats').innerHTML = [
        ['Sales', money(sales), `${sold.length} order${sold.length === 1 ? '' : 's'}${cancelled ? ` · ${cancelled} cancelled` : ''}`],
        ['Average order', money(sold.length ? sales / sold.length : 0), sold.length ? `${(items / sold.length).toFixed(1)} items each` : 'No orders yet'],
        ['Items sold', items.toLocaleString(), `${new Set(sold.flatMap(o => (o.items || []).map(i => i.id))).size} different products`],
        ['Discounts given', money(discounts), promoUses ? `${promoUses} used a promo code` : 'Member and promo discounts']
      ].map(([dt, dd, small]) => `<div class="pt-stat"><dt>${dt}</dt><dd>${dd}</dd><small>${psaEsc(small)}</small></div>`).join('');

      // Chart
      const bs = buckets(orders);
      const max = Math.max(1, ...bs.map(b => b.sum));
      document.getElementById('chartSub').textContent = `${money(sales)} ${label}${sales ? ` · best ${bs.reduce((a, b) => (b.sum > a.sum ? b : a), bs[0]).tip}` : ''}`;
      document.getElementById('chart').innerHTML = bs.map(b => `<div class="chart__bar ${b.sum ? '' : 'is-zero'}" data-tip="${psaEsc(b.tip)}: ${money(b.sum)} · ${b.n} order${b.n === 1 ? '' : 's'}"><span style="height:${Math.max(1, (b.sum / max) * 100)}%"></span></div>`).join('');
      document.getElementById('chart').setAttribute('aria-label', `Sales ${label}: ` + bs.filter(b => b.sum).map(b => `${b.tip} ${money(b.sum)}`).join(', ') || 'no sales');
      document.getElementById('chartAxis').innerHTML = bs.map(b => `<span>${psaEsc(b.label)}</span>`).join('');

      // Best sellers
      const byProduct = {};
      sold.forEach(o => (o.items || []).forEach(i => {
        const row = byProduct[i.id] || (byProduct[i.id] = { id: i.id, title: i.title, image: i.image, qty: 0, sum: 0 });
        row.qty += Number(i.quantity || 0);
        row.sum += Number(i.priceUSD || 0) * Number(i.quantity || 0);
      }));
      const top = Object.values(byProduct).sort((a, b) => b.sum - a.sum).slice(0, 6);
      document.getElementById('topBody').innerHTML = top.length ? top.map(r => {
        const p = products().find(x => x.id === r.id);
        const stock = p ? p.stock : null;
        return `<tr>
          <td><div style="display:flex;align-items:center;gap:12px">${r.image ? `<img class="pt-thumb" src="${psaEsc(r.image)}" alt="">` : ''}<div style="min-width:0"><span class="pt-strong">${psaEsc(r.title || r.id)}</span><span class="pt-sub">${psaEsc(p ? p.categoryLabel || '' : '')}</span></div></div></td>
          <td data-label="Sold" class="is-num">${r.qty}</td>
          <td data-label="Sales" class="is-num pt-strong">${money(r.sum)}</td>
          <td data-label="In stock" class="is-num">${stock == null ? '—' : `<span class="pt-badge pt-badge--${stock === 0 ? 'red' : stock <= 5 ? 'amber' : 'green'}">${stock}</span>`}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="4"><div class="pt-empty"><h3>No sales ${label}</h3><p>Best sellers show up here once customers order.</p></div></td></tr>`;

      // Categories and payment methods
      const share = (rows, el) => {
        const total = rows.reduce((s, r) => s + r.sum, 0);
        document.getElementById(el).innerHTML = rows.length ? rows.map(r => `
          <div class="share" style="--w:${total ? Math.round((r.sum / total) * 100) : 0}%"><b>${psaEsc(r.name)}</b><em>${money(r.sum)} · ${total ? Math.round((r.sum / total) * 100) : 0}%</em><i></i></div>`).join('')
          : `<p class="pt-muted" style="margin:0">Nothing ${label} yet.</p>`;
      };
      const byCat = {};
      sold.forEach(o => (o.items || []).forEach(i => {
        const p = products().find(x => x.id === i.id);
        const name = (p && p.categoryLabel) || 'Other';
        byCat[name] = (byCat[name] || 0) + Number(i.priceUSD || 0) * Number(i.quantity || 0);
      }));
      share(Object.entries(byCat).map(([name, sum]) => ({ name, sum })).sort((a, b) => b.sum - a.sum).slice(0, 6), 'categories');
      const byPay = {};
      sold.forEach(o => { const n = o.paymentMethod || 'Other'; byPay[n] = (byPay[n] || 0) + Number(o.totalUSD || 0); });
      share(Object.entries(byPay).map(([name, sum]) => ({ name, sum })).sort((a, b) => b.sum - a.sum), 'payments');

      // Latest orders (any period)
      const recent = allOrders().slice(0, 6);
      document.getElementById('recentBody').innerHTML = recent.length ? recent.map(o => `
        <tr>
          <td><a class="pt-strong pt-mono" style="text-decoration:none" href="order-detail--admin-payment-submitted.html?order=${encodeURIComponent(o.id)}">${psaEsc(o.id)}</a><span class="pt-sub">${psaEsc(o.date || '')}</span></td>
          <td><span class="pt-strong">${psaEsc(o.customerName)}</span><span class="pt-sub">${psaEsc(o.paymentMethod || '')}</span></td>
          <td data-label="Total" class="is-num pt-strong">${money(o.totalUSD)}</td>
          <td data-label="Status"><span class="pt-badge pt-badge--${STATUS_TONE[o.status] || 'grey'}">${psaEsc(o.status)}</span></td>
        </tr>`).join('') : '<tr><td colspan="4"><div class="pt-empty"><h3>No orders yet</h3><p>They show up here as soon as a customer checks out.</p></div></td></tr>';
    }

    // What needs doing now, linked to the page that does it (only what this role can act on).
    function renderTodo() {
      const all = allOrders();
      const rows = [];
      if (ptCan('verify_payments')) {
        const n = all.filter(o => o.orderStatus === 'pending_payment' && (o.paymentCode === 'cod' || o.slipUploaded || o.paymentStatus === 'paid_demo')).length;
        rows.push({ n, title: 'Payments to check', sub: 'Slips sent and cash orders to confirm', href: 'admin-orders.html?show=pending_payment' });
      }
      if (ptCan('manage_orders')) {
        rows.push({ n: all.filter(o => o.orderStatus === 'processing').length, title: 'Ready to send out', sub: 'Paid and being prepared', href: 'admin-orders.html?show=processing' });
        rows.push({ n: all.filter(o => o.orderStatus === 'out_for_delivery').length, title: 'Out for delivery', sub: 'Mark delivered when they arrive', href: 'admin-orders.html?show=out_for_delivery' });
      }
      if (ptCan('manage_stock') || ptCan('manage_products')) {
        const low = products().filter(p => p.status !== 'archived' && Number(p.stock) <= 5);
        rows.push({ n: low.length, title: 'Low on stock', sub: low.length ? low.slice(0, 2).map(p => p.title).join(', ') + (low.length > 2 ? '…' : '') : '5 or fewer left', href: 'admin-products.html' });
      }
      if (ptCan('manage_messages')) {
        rows.push({ n: (typeof psaBellState !== 'undefined' && psaBellState.unreadMessages) || 0, title: 'Unread messages', sub: 'From customers about their orders', href: 'admin-messages.html', live: true });
      }
      document.getElementById('todo').innerHTML = rows.length ? rows.map(r => `
        <a class="todo ${r.n ? 'is-hot' : ''}" href="${r.href}" ${r.live ? 'data-live-messages' : ''}>
          <span class="todo__n">${r.n}</span>
          <span style="min-width:0"><b>${r.title}</b><small>${psaEsc(r.sub)}</small></span>
          ${CHEVRON}
        </a>`).join('') : '<p class="pt-muted" style="padding:20px;margin:0">Nothing for your role here.</p>';
    }

    function exportCsv() {
      const rows = inRange();
      const head = ['Order', 'Date', 'Customer', 'Phone', 'Items', 'Subtotal', 'Member discount', 'Promo code', 'Promo discount', 'Delivery', 'Total', 'Payment', 'Status'];
      const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [head.map(cell).join(',')].concat(rows.map(o => [
        o.id, o.date, o.customerName, o.phone, (o.items || []).reduce((n, i) => n + Number(i.quantity || 0), 0),
        o.subtotalUSD, o.memberDiscountUSD || '0.00', o.promoCode || '', o.discountUSD || '0.00', o.deliveryUSD, o.totalUSD, o.paymentMethod, o.status
      ].map(cell).join(',')));
      const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `psaonline-orders-${range}-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      showRBACToast(`${rows.length} order${rows.length === 1 ? '' : 's'} exported.`, 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (ptDenied()) return;
      render();
      renderTodo();
      document.getElementById('rangeSeg').addEventListener('click', e => {
        const b = e.target.closest('[data-range]');
        if (!b) return;
        range = b.dataset.range;
        document.querySelectorAll('[data-range]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        render();
      });
      document.getElementById('exportBtn').addEventListener('click', exportCsv);
      document.addEventListener('psa:notifications', renderTodo);
      setTimeout(renderTodo, 1500); // the message count arrives with the bell
      setInterval(() => { if (!document.hidden) renderTodo(); }, 15000);
    });
  </script>
</body>
</html>
