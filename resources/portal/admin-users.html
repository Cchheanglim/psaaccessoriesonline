<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff & roles — PsaOnline Staff</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Accounts, the role each person has, and what each role may do." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { sorbet: '#FFA552', cotton: '#F9F3EA', espresso: '#2B1D1D' } } } };</script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <style>
    .role-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; font: inherit; color: var(--pt-ink); }
    .role-item:hover { background: var(--pt-sunken); }
    .role-item[aria-current="true"] { background: var(--pt-accent-soft); }
    .role-item b { display: block; font-size: 14px; font-weight: 700; }
    .role-item small { display: block; font-size: 12px; color: var(--pt-ink-2); margin-top: 1px; }
    .role-item .pt-badge { margin-left: auto; }
    .perm-group + .perm-group { margin-top: 18px; }
    .perm-group h3 { font-size: 13px; font-weight: 800; color: var(--pt-ink-2); margin: 0 0 4px 12px; }
    .perm-grid { display: grid; gap: 2px; }
    @media (min-width: 720px) { .perm-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body class="pt" data-portal="users">
  <div class="pt-frame">
    <main class="pt-main">
      <div class="pt-head">
        <div class="pt-head__text">
          <h1>Staff &amp; roles</h1>
          <p>Everyone with an account, the role each person has, and what each role is allowed to do in this portal.</p>
        </div>
        <div class="pt-head__actions">
          <a href="user-form.html" class="pt-btn pt-btn--primary" id="addUserBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add account
          </a>
        </div>
      </div>

      <div class="pt-tabs" role="tablist" aria-label="Staff and roles">
        <button type="button" role="tab" id="tab-people" aria-controls="panel-people" aria-selected="true" data-tab="people">People</button>
        <button type="button" role="tab" id="tab-roles" aria-controls="panel-roles" aria-selected="false" data-tab="roles" hidden>Roles &amp; permissions</button>
      </div>

      <!-- People -->
      <section id="panel-people" role="tabpanel" aria-labelledby="tab-people" class="pt-panel">
        <div class="pt-toolbar">
          <div class="pt-seg" id="peopleFilter" aria-label="Show">
            <button type="button" data-who="team" aria-pressed="true">Team</button>
            <button type="button" data-who="customers" aria-pressed="false">Customers</button>
            <button type="button" data-who="all" aria-pressed="false">Everyone</button>
          </div>
          <div class="pt-toolbar__end">
            <label class="pt-search" style="width:260px;max-width:100%">
              <span class="sr-only">Search people</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="peopleSearch" type="search" class="pt-input" placeholder="Name, email or phone" autocomplete="off" />
            </label>
            <label><span class="sr-only">Account status</span>
              <select id="statusFilter" class="pt-select" style="width:auto">
                <option value="all">Any status</option>
                <option value="Active">Active</option>
                <option value="Suspended">Suspended</option>
              </select>
            </label>
          </div>
        </div>
        <div class="pt-table-wrap">
          <table class="pt-table pt-table--stack">
            <thead>
              <tr>
                <th scope="col">Person</th>
                <th scope="col">Role</th>
                <th scope="col">Status</th>
                <th scope="col">Joined</th>
                <th scope="col" class="is-end"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="peopleBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Roles & permissions (admins only) -->
      <section id="panel-roles" role="tabpanel" aria-labelledby="tab-roles" hidden>
        <div class="pt-grid pt-grid--side-main">
          <div class="pt-panel">
            <div class="pt-panel__head">
              <div>
                <h2 class="pt-section-title">Roles</h2>
                <p class="pt-section-sub">Pick one to see what it can do.</p>
              </div>
              <button type="button" class="pt-btn pt-btn--secondary pt-btn--sm" id="newRoleBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                New role
              </button>
            </div>
            <div style="padding:8px" id="roleList"><span class="pt-skel" style="margin:12px"></span></div>
          </div>

          <form class="pt-panel" id="roleForm" novalidate>
            <div class="pt-panel__head">
              <div>
                <h2 class="pt-section-title" id="roleTitle">Role</h2>
                <p class="pt-section-sub" id="roleSub"></p>
              </div>
            </div>
            <div class="pt-panel__body">
              <div class="pt-row pt-row--2">
                <div class="pt-field">
                  <label class="pt-label" for="roleName">Role name</label>
                  <input id="roleName" class="pt-input" maxlength="40" placeholder="For example: Delivery rider" />
                  <span class="pt-error" id="roleNameError" hidden></span>
                </div>
                <div class="pt-field">
                  <label class="pt-label" for="roleDescription">What this role is for <span class="pt-faint">(optional)</span></label>
                  <input id="roleDescription" class="pt-input" maxlength="160" placeholder="Takes orders to customers" />
                </div>
              </div>
              <div id="roleNote" class="pt-note" style="margin-top:18px" hidden></div>
              <div style="margin-top:22px">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px">
                  <h3 class="pt-section-title" style="font-size:15px">Permissions</h3>
                  <span class="pt-faint" id="permCount" style="font-size:13px;font-weight:600"></span>
                </div>
                <div id="permList"></div>
              </div>
              <span class="pt-error" id="roleError" hidden></span>
            </div>
            <div class="pt-panel__foot">
              <button type="button" class="pt-btn pt-btn--danger" id="deleteRoleBtn" style="margin-right:auto" hidden>Delete role</button>
              <button type="submit" class="pt-btn pt-btn--primary" id="saveRoleBtn">Save role</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/rbac.js"></script>
  <script src="assets/js/portal-shell.js"></script>
  <script>
    const me = getCurrentUser();
    const isAdmin = me.role === 'Admin';
    let who = 'team';
    let roleData = { roles: [], permissions: [] };
    let selectedRole = null; // role id, or 'new'

    const people = () => getRBACUsers() || [];
    const roleNames = () => (PSA.roles && PSA.roles.length ? PSA.roles.map(r => r.name) : ['Admin', 'Staff', 'Buyer']);
    const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    const ROLE_TONE = { Admin: 'violet', Staff: 'sky', Buyer: 'grey' };

    /* ---------- People ---------- */

    function renderPeople() {
      const q = document.getElementById('peopleSearch').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const rows = people().filter(u => (who === 'all' || (who === 'team' ? u.role !== 'Buyer' : u.role === 'Buyer'))
        && (status === 'all' || (u.status || 'Active') === status)
        && (!q || [u.name, u.email, u.phone].some(v => String(v || '').toLowerCase().includes(q))));
      const body = document.getElementById('peopleBody');
      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="5"><div class="pt-empty"><h3>No one matches</h3><p>${who === 'team' && !q ? 'Add an account and give it a staff role to bring someone onto the team.' : 'Try another name, or switch between Team and Customers.'}</p></div></td></tr>`;
        return;
      }
      body.innerHTML = rows.map(u => {
        const self = String(u.id) === String(me.id);
        const lockedAdmin = u.role === 'Admin' && !isAdmin;
        const canChange = PSA.online && !self && !lockedAdmin;
        const options = roleNames().filter(n => isAdmin || n !== 'Admin');
        const roleCell = canChange
          ? `<label><span class="sr-only">Role for ${psaEsc(u.name)}</span><select class="pt-select" data-role-for="${psaEsc(u.id)}" style="height:34px;width:auto;min-width:140px;font-size:13px">
              ${options.map(n => `<option value="${psaEsc(n)}" ${n === u.role ? 'selected' : ''}>${psaEsc(n)}</option>`).join('')}
            </select></label>`
          : `<span class="pt-badge pt-badge--${ROLE_TONE[u.role] || 'accent'} pt-badge--plain">${psaEsc(u.role)}</span>`;
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:12px">
                <span class="pt-avatar" aria-hidden="true">${u.avatarUrl ? `<img src="${psaEsc(u.avatarUrl)}" alt="">` : psaEsc(initials(u.name))}</span>
                <div style="min-width:0">
                  <span class="pt-strong">${psaEsc(u.name)}</span>${self ? ' <span class="pt-badge pt-badge--accent pt-badge--plain" style="height:20px;margin-left:4px">You</span>' : ''}
                  <span class="pt-sub">${psaEsc(u.email)}${u.phone ? ' · ' + psaEsc(u.phone) : ''}</span>
                </div>
              </div>
            </td>
            <td data-label="Role">${roleCell}</td>
            <td data-label="Status"><span class="pt-badge pt-badge--${(u.status || 'Active') === 'Active' ? 'green' : 'red'}">${psaEsc(u.status || 'Active')}</span></td>
            <td data-label="Joined"><span class="pt-muted">${psaEsc(u.created || '—')}</span></td>
            <td class="is-end"><div class="pt-actions">${lockedAdmin ? '' : `<a class="pt-btn pt-btn--secondary pt-btn--sm" href="user-form.html?id=${encodeURIComponent(u.id)}">Edit</a>`}</div></td>
          </tr>`;
      }).join('');
    }

    async function changeRole(select) {
      const id = select.dataset.roleFor;
      const before = people().find(u => String(u.id) === id);
      select.disabled = true;
      try {
        const { user } = await psaApi('PATCH', `/api/admin/users/${encodeURIComponent(id)}`, { role: select.value });
        PSA.users = PSA.users.map(u => (String(u.id) === String(user.id) ? user : u));
        showRBACToast(`${psaEsc(user.name)} is now ${psaEsc(user.role)}.`, 'success');
        if (roleData.roles.length) loadRoles();
      } catch (err) {
        showRBACToast(psaEsc(err.message), 'danger');
        select.value = before ? before.role : select.value;
      } finally {
        select.disabled = false;
        renderPeople();
      }
    }

    /* ---------- Roles & permissions ---------- */

    async function loadRoles(selectId) {
      try {
        roleData = await psaApi('GET', '/api/admin/roles');
        PSA.roles = roleData.roles.map(r => ({ name: r.name, description: r.description, portal: r.portal }));
        if (selectId !== undefined) selectedRole = selectId;
        if (selectedRole !== 'new' && !roleData.roles.some(r => r.id === selectedRole)) selectedRole = (roleData.roles.find(r => r.name === 'Staff') || roleData.roles[0]).id;
        renderRoleList();
        renderRoleForm();
        renderPeople();
      } catch (err) {
        document.getElementById('roleList').innerHTML = `<p class="pt-error" style="margin:12px">${psaEsc(err.message)}</p>`;
      }
    }

    function renderRoleList() {
      document.getElementById('roleList').innerHTML = roleData.roles.map(r => `
        <button type="button" class="role-item" data-role="${r.id}" aria-current="${r.id === selectedRole}">
          <span style="min-width:0">
            <b>${psaEsc(r.name)}</b>
            <small>${r.users} ${r.users === 1 ? 'person' : 'people'}${r.name === 'Buyer' ? ' · shop only' : ` · ${r.permissions.length} of ${roleData.permissions.length} permissions`}</small>
          </span>
          ${r.builtIn ? '' : '<span class="pt-badge pt-badge--accent pt-badge--plain">Custom</span>'}
        </button>`).join('') + (selectedRole === 'new' ? `
        <button type="button" class="role-item" aria-current="true"><span><b>New role</b><small>Not saved yet</small></span></button>` : '');
    }

    function renderRoleForm() {
      const role = selectedRole === 'new'
        ? { id: null, name: '', description: '', builtIn: false, locked: false, users: 0, permissions: [] }
        : roleData.roles.find(r => r.id === selectedRole);
      if (!role) return;
      const isNew = role.id === null;
      const fixedName = role.builtIn;
      document.getElementById('roleTitle').textContent = isNew ? 'New role' : role.name;
      document.getElementById('roleSub').textContent = isNew
        ? 'Name it, tick what it may do, then give it to people from the People tab.'
        : `${role.users} ${role.users === 1 ? 'person has' : 'people have'} this role.`;
      const name = document.getElementById('roleName');
      name.value = role.name;
      name.disabled = fixedName;
      const desc = document.getElementById('roleDescription');
      desc.value = role.description || '';
      desc.disabled = role.locked;
      hideErrors();

      const note = document.getElementById('roleNote');
      const notes = {
        Admin: 'Admin always has every permission, so there is always someone who can fix things. Admin is also the only role that can change roles.',
        Buyer: 'Buyers are customers. They shop, order and review, and never see this portal.',
        Staff: 'The Staff role comes with the website, so it can\'t be renamed or deleted. Its permissions are yours to choose.'
      };
      note.hidden = !notes[role.name] || isNew;
      note.innerHTML = notes[role.name] ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>${notes[role.name]}</span>` : '';

      const groups = [];
      roleData.permissions.forEach(p => {
        let g = groups.find(x => x.name === p.group);
        if (!g) groups.push(g = { name: p.group, items: [] });
        g.items.push(p);
      });
      document.getElementById('permList').innerHTML = role.name === 'Buyer'
        ? '<p class="pt-muted" style="margin:0 12px">No portal permissions.</p>'
        : groups.map(g => `
          <div class="perm-group">
            <h3>${psaEsc(g.name)}</h3>
            <div class="perm-grid">${g.items.map(p => `
              <label class="pt-check ${role.locked ? 'is-disabled' : ''}">
                <input type="checkbox" name="perm" value="${psaEsc(p.name)}" ${role.permissions.includes(p.name) ? 'checked' : ''} ${role.locked ? 'disabled' : ''}>
                <span><b>${psaEsc(p.label)}</b><small>${psaEsc(p.description || '')}</small></span>
              </label>`).join('')}
            </div>
          </div>`).join('');
      updatePermCount();

      document.getElementById('saveRoleBtn').hidden = role.locked;
      document.getElementById('saveRoleBtn').textContent = isNew ? 'Create role' : 'Save changes';
      const del = document.getElementById('deleteRoleBtn');
      del.hidden = isNew || role.builtIn;
      del.disabled = role.users > 0;
      del.title = role.users > 0 ? 'Move its people to another role first' : '';
    }

    function updatePermCount() {
      const boxes = [...document.querySelectorAll('#permList input[name="perm"]')];
      document.getElementById('permCount').textContent = boxes.length ? `${boxes.filter(b => b.checked).length} of ${boxes.length} ticked` : '';
    }

    function hideErrors() {
      ['roleNameError', 'roleError'].forEach(id => { const el = document.getElementById(id); el.hidden = true; el.textContent = ''; });
      document.getElementById('roleName').removeAttribute('aria-invalid');
    }

    function showError(err) {
      const field = err.errors && err.errors.name ? 'roleNameError' : 'roleError';
      const el = document.getElementById(field);
      const own = err.errors && err.errors.name;
      el.textContent = own ? [].concat(own)[0] : err.message;
      el.hidden = false;
      if (field === 'roleNameError') { document.getElementById('roleName').setAttribute('aria-invalid', 'true'); document.getElementById('roleName').focus(); }
    }

    async function saveRole(e) {
      e.preventDefault();
      hideErrors();
      const isNew = selectedRole === 'new';
      const role = roleData.roles.find(r => r.id === selectedRole);
      const payload = {
        permissions: [...document.querySelectorAll('#permList input[name="perm"]:checked')].map(b => b.value),
        description: document.getElementById('roleDescription').value.trim() || null
      };
      if (isNew || (role && !role.builtIn)) payload.name = document.getElementById('roleName').value.trim();
      if (isNew && !payload.name) { showError({ errors: { name: 'Give the role a name.' } }); return; }
      const btn = document.getElementById('saveRoleBtn');
      psaSetButtonLoading(btn, true, 'Saving…');
      try {
        const res = isNew
          ? await psaApi('POST', '/api/admin/roles', payload)
          : await psaApi('PATCH', `/api/admin/roles/${selectedRole}`, payload);
        const saved = isNew ? res.roles.find(r => r.name.toLowerCase() === payload.name.toLowerCase()) : null;
        roleData = res;
        PSA.roles = res.roles.map(r => ({ name: r.name, description: r.description, portal: r.portal }));
        if (saved) selectedRole = saved.id;
        renderRoleList();
        renderRoleForm();
        renderPeople();
        showRBACToast(isNew ? `Role "${psaEsc(payload.name)}" created. Give it to people from the People tab.` : 'Role saved. People with it get the new permissions straight away.', 'success');
      } catch (err) {
        showError(err);
      } finally {
        psaSetButtonLoading(btn, false);
      }
    }

    async function deleteRole() {
      const role = roleData.roles.find(r => r.id === selectedRole);
      if (!role || !confirm(`Delete the role "${role.name}"? This can't be undone.`)) return;
      try {
        roleData = await psaApi('DELETE', `/api/admin/roles/${role.id}`);
        PSA.roles = roleData.roles.map(r => ({ name: r.name, description: r.description, portal: r.portal }));
        selectedRole = (roleData.roles.find(r => r.name === 'Staff') || roleData.roles[0]).id;
        renderRoleList();
        renderRoleForm();
        renderPeople();
        showRBACToast(`Role "${psaEsc(role.name)}" deleted.`, 'success');
      } catch (err) {
        showError(err);
      }
    }

    function showTab(tab) {
      if (tab === 'roles' && !isAdmin) tab = 'people';
      document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
      document.getElementById('panel-people').hidden = tab !== 'people';
      document.getElementById('panel-roles').hidden = tab !== 'roles';
      document.getElementById('addUserBtn').hidden = tab !== 'people';
      if (tab === 'roles' && !roleData.roles.length) loadRoles();
      history.replaceState(null, '', tab === 'roles' ? '#roles' : location.pathname + location.search);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (ptDenied()) return;
      if (isAdmin && PSA.online) document.getElementById('tab-roles').hidden = false;
      renderPeople();
      showTab(location.hash === '#roles' ? 'roles' : 'people');

      document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
      document.getElementById('peopleFilter').addEventListener('click', e => {
        const b = e.target.closest('[data-who]');
        if (!b) return;
        who = b.dataset.who;
        document.querySelectorAll('[data-who]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        renderPeople();
      });
      document.getElementById('peopleSearch').addEventListener('input', renderPeople);
      document.getElementById('statusFilter').addEventListener('change', renderPeople);
      document.getElementById('peopleBody').addEventListener('change', e => { if (e.target.matches('[data-role-for]')) changeRole(e.target); });

      document.getElementById('roleList').addEventListener('click', e => {
        const b = e.target.closest('[data-role]');
        if (!b) return;
        selectedRole = Number(b.dataset.role);
        renderRoleList();
        renderRoleForm();
      });
      document.getElementById('newRoleBtn').addEventListener('click', () => {
        selectedRole = 'new';
        renderRoleList();
        renderRoleForm();
        document.getElementById('roleName').focus();
      });
      document.getElementById('permList').addEventListener('change', updatePermCount);
      document.getElementById('roleForm').addEventListener('submit', saveRole);
      document.getElementById('deleteRoleBtn').addEventListener('click', deleteRole);
    });
  </script>
</body>
</html>
