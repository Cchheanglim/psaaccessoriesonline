<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — PsaOnline Staff</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Check payments, send orders out and mark them delivered." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { sorbet: '#FFA552', cotton: '#F9F3EA', espresso: '#2B1D1D' } } } };</script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
</head>
<body class="pt" data-portal="orders">
  <div class="pt-frame">
    <main class="pt-main">
      <div class="pt-head">
        <div class="pt-head__text">
          <h1>Orders</h1>
          <p>Check payments, send orders out and mark them delivered. Open an order to see its items, the customer's pin and messages.</p>
        </div>
        <div class="pt-head__actions">
          <label class="pt-search" style="width:300px;max-width:100%">
            <span class="sr-only">Search orders</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="orderSearch" type="search" class="pt-input" placeholder="Order number, name or phone" autocomplete="off" />
          </label>
        </div>
      </div>

      <section class="pt-panel" aria-labelledby="ordersHeading">
        <h2 id="ordersHeading" class="sr-only">Order list</h2>
        <div class="pt-toolbar">
          <div class="pt-seg" role="tablist" aria-label="Show orders" id="orderFilters"></div>
        </div>
        <div class="pt-table-wrap">
          <table class="pt-table pt-table--stack">
            <thead>
              <tr>
                <th scope="col">Order</th>
                <th scope="col">Customer</th>
                <th scope="col" class="is-num">Total</th>
                <th scope="col">Payment</th>
                <th scope="col">Status</th>
                <th scope="col" class="is-end"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="6"><span class="pt-skel" style="width:40%"></span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="slipDialog" class="pt-dialog" aria-labelledby="slipTitle">
    <div class="pt-dialog__head">
      <h2 id="slipTitle">Payment slip</h2>
      <button type="button" class="pt-btn pt-btn--ghost pt-btn--icon" data-close-slip aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="pt-panel__body" id="slipHolder"></div>
  </dialog>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/rbac.js"></script>
  <script src="assets/js/portal-shell.js"></script>
  <script>
    const FILTERS = [
      { id: 'action', label: 'Needs action', match: o => nextStep(o) !== null },
      { id: 'pending_payment', label: 'Awaiting payment', match: o => o.orderStatus === 'pending_payment' },
      { id: 'processing', label: 'Preparing', match: o => o.orderStatus === 'processing' },
      { id: 'out_for_delivery', label: 'Out for delivery', match: o => o.orderStatus === 'out_for_delivery' },
      { id: 'delivered', label: 'Delivered', match: o => o.orderStatus === 'delivered' },
      { id: 'cancelled', label: 'Cancelled', match: o => o.orderStatus === 'cancelled' },
      { id: 'all', label: 'All', match: () => true }
    ];
    const STATUS_TONE = {
      'Payment Pending': 'amber', 'Slip Uploaded': 'amber', 'Paid (demo)': 'amber', 'Payment Failed': 'red',
      'Processing': 'violet', 'Out for delivery': 'sky', 'Delivered': 'green', 'Cancelled': 'red', 'Refunded': 'grey'
    };
    let filter = 'action';
    let query = '';

    const money = v => '$' + Number(v || 0).toFixed(2);
    const orders = () => (PSA.online ? PSA.orders : JSON.parse(localStorage.getItem('psa_orders') || '[]'));

    // The one next step for an order, if this role is allowed to take it (the server checks the same rules).
    function nextStep(o) {
      const cod = o.paymentCode === 'cod';
      if (o.orderStatus === 'pending_payment') {
        if (!ptCan('verify_payments')) return null;
        if (cod) return { action: 'verify', label: 'Confirm order' };
        if (o.slipUploaded || o.paymentStatus === 'paid_demo') return { action: 'verify', label: 'Approve payment' };
        return null; // waiting for the customer's slip
      }
      if (o.orderStatus === 'processing' && ptCan('manage_orders')) return { action: 'dispatch', label: 'Send out' };
      if (o.orderStatus === 'out_for_delivery' && ptCan('manage_orders')) return { action: 'deliver', label: 'Mark delivered' };
      return null;
    }

    function renderFilters() {
      const list = orders();
      document.getElementById('orderFilters').innerHTML = FILTERS.map(f => {
        const n = list.filter(f.match).length;
        const hot = f.id === 'action' && n > 0;
        return `<button type="button" role="tab" data-filter="${f.id}" aria-selected="${f.id === filter}">${f.label}${f.id !== 'all' ? `<em class="${hot ? 'is-hot' : ''}">${n}</em>` : ''}</button>`;
      }).join('');
    }

    function render() {
      renderFilters();
      const f = FILTERS.find(x => x.id === filter);
      const q = query.trim().toLowerCase();
      const rows = orders().filter(f.match).filter(o => !q
        || String(o.id).toLowerCase().includes(q)
        || String(o.customerName || '').toLowerCase().includes(q)
        || String(o.phone || '').replace(/\s/g, '').includes(q.replace(/\s/g, '')));
      const body = document.getElementById('ordersBody');

      if (!rows.length) {
        const empty = !orders().length
          ? ['No orders yet', 'Orders show up here as soon as a customer checks out.']
          : filter === 'action' && !q
            ? ['Nothing waiting on you', 'Every order that needs a payment check, sending out or delivering is done. New ones appear here.']
            : ['No orders match', 'Try another tab or search for a different name, phone or order number.'];
        body.innerHTML = `<tr><td colspan="6"><div class="pt-empty"><h3>${empty[0]}</h3><p>${empty[1]}</p></div></td></tr>`;
        return;
      }

      body.innerHTML = rows.map(o => {
        const id = psaEsc(o.id);
        const href = `order-detail--admin-payment-submitted.html?order=${encodeURIComponent(o.id)}`;
        const step = nextStep(o);
        const items = (o.items || []).reduce((n, i) => n + Number(i.quantity || 0), 0);
        const slip = typeof o.slipImage === 'string' && /^(data:image\/|https?:\/\/)/.test(o.slipImage);
        return `
          <tr>
            <td><a href="${href}" class="pt-strong pt-mono" style="text-decoration:none">${id}</a><span class="pt-sub">${psaEsc(o.date || '')}</span></td>
            <td><span class="pt-strong">${psaEsc(o.customerName)}</span><span class="pt-sub">${psaEsc(o.phone || '')}</span></td>
            <td data-label="Total" class="is-num"><span class="pt-strong">${money(o.totalUSD)}</span><span class="pt-sub">${items} item${items === 1 ? '' : 's'}${o.promoCode ? ` · ${psaEsc(o.promoCode)}` : ''}</span></td>
            <td data-label="Payment"><span>${psaEsc(o.paymentMethod || '—')}</span>${slip ? `<button type="button" class="pt-sub" data-slip="${id}" style="color:var(--pt-accent-ink);font-weight:700;background:none;border:0;padding:0;cursor:pointer">View slip</button>` : ''}</td>
            <td data-label="Status"><span class="pt-badge pt-badge--${STATUS_TONE[o.status] || 'grey'}">${psaEsc(o.status)}</span></td>
            <td class="is-end"><div class="pt-actions">
              ${step && PSA.online ? `<button type="button" class="pt-btn pt-btn--primary pt-btn--sm" data-step="${step.action}" data-order="${id}">${step.label}</button>` : ''}
              <a class="pt-btn pt-btn--secondary pt-btn--sm" href="${href}">Open</a>
            </div></td>
          </tr>`;
      }).join('');
    }

    async function runStep(button) {
      const id = button.dataset.order;
      psaSetButtonLoading(button, true, 'Saving…');
      try {
        const { order } = await psaApi('PATCH', `/api/admin/orders/${encodeURIComponent(id)}`, { action: button.dataset.step });
        PSA.orders = PSA.orders.map(o => (o.id === order.id ? order : o));
        render();
        showRBACToast(`Order ${psaEsc(order.id)} is now ${psaEsc(order.status.toLowerCase())}.`, 'success');
      } catch (err) {
        psaSetButtonLoading(button, false);
        showRBACToast(psaEsc(err.message), 'danger');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (ptDenied()) return;
      const wanted = new URLSearchParams(location.search).get('show');
      if (FILTERS.some(f => f.id === wanted)) filter = wanted;
      else if (!orders().some(o => nextStep(o))) filter = 'all';
      render();

      document.getElementById('orderFilters').addEventListener('click', e => {
        const b = e.target.closest('[data-filter]');
        if (!b) return;
        filter = b.dataset.filter;
        render();
      });
      document.getElementById('orderSearch').addEventListener('input', e => { query = e.target.value; render(); });
      document.getElementById('ordersBody').addEventListener('click', e => {
        const step = e.target.closest('[data-step]');
        if (step) return runStep(step);
        const slip = e.target.closest('[data-slip]');
        if (slip) {
          const o = orders().find(x => x.id === slip.dataset.slip);
          document.getElementById('slipTitle').textContent = `Payment slip · ${o.id}`;
          const img = document.createElement('img');
          img.src = o.slipImage;
          img.alt = `Payment slip for order ${o.id}`;
          img.style.cssText = 'max-height:70vh;margin:0 auto;border-radius:10px';
          document.getElementById('slipHolder').replaceChildren(img);
          document.getElementById('slipDialog').showModal();
        }
      });
      const dlg = document.getElementById('slipDialog');
      dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close-slip]')) dlg.close(); });
    });
  </script>
</body>
</html>
