# Render Blueprint. In Render choose New > Blueprint and point it at this repo.
# Values marked "sync: false" are secrets: Render asks for them on first deploy
# and they are never stored in this file.
services:
  - type: web
    name: psaonlineaccessories
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: PsaOnlineAccessories
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: TRUSTED_PROXIES
        value: "*"
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: BAKONG_KHQR_MERCHANT_ID
        sync: false
      - key: BAKONG_KHQR_MERCHANT_NAME
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
